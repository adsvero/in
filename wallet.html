<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet | ADSVERO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f2f2f2;
}

/* ===== MOBILE CONTAINER ===== */
#page{
  max-width:430px;
  width:100%;
  margin:0 auto;
  background:white;
  min-height:100vh;
  overflow-y:auto;   /* 👈 SCROLL FIX */
}

/* HEADER */
.header{
background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
padding:18px 0;
color:#fff;
border-bottom-left-radius:32px;
border-bottom-right-radius:32px;
}

.header-top{
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
}

.brand{
display:flex;
align-items:center;
gap:8px;
font-weight:700;
font-size:20px;
}

.brand img{
height:36px;
}

.wallet-badge{
background:rgba(255,255,255,.25);
padding:8px 12px;
border-radius:20px;
font-weight:700;
}


/* ===== BALANCE BADGE (CARD STYLE) ===== */
.wallet-badge{
  background:rgba(255,255,255,.25);
  padding:8px 12px;
  border-radius:20px;
  font-weight:bold;
}

/* ===== MAIN SECTION ===== */
.section{
  padding:16px;
}

/* ===== CARDS ===== */
.card{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 8px 22px rgba(0,0,0,.12);
  border:1px solid rgba(0,0,0,.05);
  pointer-events:auto;   /* 👈 CLICK FIX */
}

/* ===== INPUT BOX ===== */
.input-box input{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

/* clickable fix */
.input-box{
  pointer-events:auto;
}

/* ===== CHANGE UPI LINK ===== */
.change-upi{
  color:#ff3b3b;
  margin-top:6px;
  cursor:pointer;
}

/* ===== WITHDRAW BUTTON ===== */
.withdraw-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#f2a60c;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-item.active{ color:#ff3b3b; }
</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="brand">
      <img src="Image/logo.png">
      <span></span>
    </div>
    <div class="wallet-badge">₹ 0.00</div>
  </div>
</div>

<div class="section">
<h3>Withdraw Funds</h3>

<!-- AMOUNT CARD -->
<div class="card">
  <p><b>Excisee Amount (₹)</b></p>
  <div class="input-box">
    <input type="number" id="withdrawAmount" placeholder="Enter amount">
  </div>
  <p style="color:#777;margin-top:6px;">
    Minimum ₹500 → ₹1000000
  </p>
</div>

<!-- BANK CARD -->
<div class="card">
  <p><b>Bank Transfer</b></p>
  <div class="input-box">
    <input type="text" id="bankName" value="himanshu kumar">
  </div>
  <p class="change-upi" onclick="alert('Bank change page coming soon')">
    Change Bank &gt;
  </p>
</div>

<!-- UPI CARD -->
<div class="card">
  <p><b>UPI</b></p>
  <div class="input-box">
    <input type="text" id="upiId" value="himanshu@upi">
  </div>
  <p class="change-upi" onclick="alert('UPI change page coming soon')">
    Change UPI &gt;
  </p>
</div>

<!-- BUTTON -->
<button class="withdraw-btn" onclick="requestWithdraw()">
  Request Withdraw
</button>

<p style="margin-top:8px;color:#777;">
Withdrawals are processed within 24–72 hours.
</p>

</div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item">
    <a href="index.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Home.png">Home
    </a>
  </div>

  <div class="nav-item">
    <a href="tasks.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Task.png">Tasks
    </a>
  </div>

  <div class="nav-item active">
    <a href="wallet.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Wallet.png">Wallet
    </a>
  </div>

  <div class="nav-item">
    <a href="account.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Name.png">Account
    </a>
  </div>
</div>

<script>
function requestWithdraw(){
  let amt = document.getElementById("withdrawAmount").value;

  if(amt == "" || amt < 500){
    alert("Minimum withdraw ₹500 required ❌");
    return;
  }

  alert("Withdraw Request Submitted ✅");
}
</script>

</body>
</html>
