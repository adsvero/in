<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet | ADSVERO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f2f2f2;
}

/* ===== MOBILE CONTAINER ===== */
#page{
  max-width:430px;
  width:100%;
  margin:0 auto;
  background:white;
  min-height:100vh;
}

/* ===== RED HEADER ===== */
.wallet-header{
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
  color:white;
  padding:18px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

.wallet-header .left{
  display:flex;
  align-items:center;
  gap:8px;
}

.wallet-header img{
  height:28px;
}

/* ===== MAIN CONTENT ===== */
.section{
  padding:16px;
}

.card{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.12);
  border:1px solid rgba(0,0,0,0.05);
}

/* REAL INPUT BOX (editable) */
.input-box input{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

/* clickable change upi */
.change-upi{
  color:#ff3b3b;
  cursor:pointer;
  margin-top:6px;
}

/* Withdraw Button */
.withdraw-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#f2a60c;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-item.active{ color:#ff3b3b; }
</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="wallet-header">
  <div class="left">
    <img src="Image/logo.png">
    <span>ADSVERO</span>
  </div>
  <div>
    ₹ <span id="walletBalance">0.00</span>
  </div>
</div>

<div class="section">

<h3>Withdraw Funds</h3>

<!-- AMOUNT CARD -->
<div class="card">
  <p><b>Excisee Amount (₹)</b></p>

  <div class="input-box">
    <input type="number" id="withdrawAmount" placeholder="Enter amount">
  </div>

  <p style="margin-top:6px;color:#777;">
    Minimum ₹500 → ₹1000000
  </p>
</div>

<!-- BANK CARD -->
<div class="card">
  <p><b>Bank Transfer</b></p>

  <div class="input-box">
    <input type="text" id="bankName" value="himanshu kumar">
  </div>

  <p class="change-upi" onclick="alert('Bank details change page coming soon')">
    Change Bank >
  </p>
</div>

<!-- UPI CARD -->
<div class="card">
  <p><b>UPI</b></p>

  <div class="input-box">
    <input type="text" id="upiId" value="himanshu@upi">
  </div>

  <p class="change-upi" onclick="alert('UPI change page coming soon')">
    Change UPI >
  </p>
</div>

<!-- WORKING BUTTON -->
<button class="withdraw-btn" onclick="requestWithdraw()">
  Request Withdraw
</button>

<p style="margin-top:8px;color:#777;">
Withdrawals are processed within 24–72 hours.
</p>

</div>
</div>

<!-- BOTTOM NAV (REDIRECT WORKING) -->
<div class="bottom-nav">
  <div class="nav-item">
    <a href="index.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Home.png">Home
    </a>
  </div>

  <div class="nav-item">
    <a href="tasks.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Task.png">Tasks
    </a>
  </div>

  <div class="nav-item active">
    <a href="wallet.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Wallet.png">Wallet
    </a>
  </div>

  <div class="nav-item">
    <a href="account.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Name.png">Account
    </a>
  </div>
</div>

<script>
function requestWithdraw(){
  let amt = document.getElementById("withdrawAmount").value;

  if(amt == "" || amt < 500){
    alert("Minimum withdraw ₹500 required ❌");
    return;
  }

  alert("Withdraw Request Submitted ✅");
}
</script>

</body>
</html>
