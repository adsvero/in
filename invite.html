<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Page</title>

<style>
html, body{
margin:0;
font-family: Arial, sans-serif;
background:#f3f3f3;
width:100%;
height:100%;
overflow-y:auto;
}

/* ===== TOP BAR ===== */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:12px 14px;
color:white;
position:fixed;
top:0;
width:100%;
z-index:999;
box-sizing:border-box;
}
.top-bar img{
height:32px;
}
.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* ===== BANNER ===== */
.banner{
margin-top:56px;
width:100%;
}
.banner img{
width:100%;
display:block;
}

/* ===== FLOATING CARDS ===== */
.floating-container{
position:relative;
top:-70px;
}

/* Card style */
.card{
width:45%;
max-width:420px;
margin:-50px 45% 20px auto;
background:white;
border-radius:14px;
padding:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
text-align:center;
}

/* row layout */
.row{
display:flex;
align-items:center;
justify-content:space-between;
}

/* input boxes */
.input-box{
width:68%;
padding:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
}

/* buttons */
.small-btn{
background:#ffb000;
border:none;
padding:10px 14px;
border-radius:8px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

/* SHARE LINK CARD */
.share-card{
width:90%;
max-width:420px;
top:-40px;
margin:0 auto 20px auto;
background:white;
border-radius:14px;
padding:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

/* share button */
.share-btn{
background:#ffb000;
color:black;
border:none;
padding:10px 14px;
border-radius:8px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

/* ===== SOCIAL ICON CARD (NEW ADDITION ONLY) ===== */
.social-card{
width:90%;
max-width:420px;
margin:-60px auto 20px auto;
background:white;
border-radius:14px;
padding:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
text-align:center;
}

.social-card h4{
margin:6px 0 10px 0;
}

.social-row{
display:flex;
justify-content:space-around;
align-items:center;
}

.social-row img{
width:50px;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-item.active{ color:#ff3b3b; }

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- BANNER -->
<div class="banner">
<img src="Image/Rewardbanner.png" alt="Reward Banner">
</div>

<!-- FLOATING CARDS -->
<div class="floating-container">

<!-- INVITE CODE -->
<div class="card">
<div class="row">
<input type="text" class="input-box" id="inviteCode" value="XYZ1234" readonly>
<button class="small-btn" onclick="copyCode()">Copy Code</button>
</div>
</div>

<!-- INVITE LINK -->
<div class="share-card">
<div class="row">
<input type="text" class="input-box"
value="https://adsvero.github.io/XYZ1234">
<button class="share-btn" onclick="copyLink()">Share</button>
</div>
</div>

</div>

<!-- ===== NEW SOCIAL ICONS CARD (ONLY ADDITION) ===== -->
<div class="social-card">
<h4>Share via Apps</h4>

<div class="social-row">

<a href="https://wa.me/?text=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<a href="https://www.facebook.com/sharer/sharer.php?u=https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
</a>

<a href="sms:?body=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
</a>

</div>
</div>

<br><br><br>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item">
    <a href="index.html" style="text-decoration:none; color:inherit;">
      <img src="Image/Home.png">Home
    </a>
  </div>

  <div class="nav-item">
    <a href="tasks.html" style="text-decoration:none; color:inherit;">
      <img src="Image/Task.png">Tasks
    </a>
  </div>

  <div class="nav-item">
    <a href="wallet.html" style="text-decoration:none; color:inherit;">
      <img src="Image/Wallet.png">Wallet
    </a>
  </div>

  <div class="nav-item">
    <a href="account.html" style="text-decoration:none; color:inherit;">
      <img src="Image/Name.png">Account
    </a>
  </div>
</div>

<script>
function copyCode(){
navigator.clipboard.writeText("XYZ1234");
alert("Invite Code Copied!");
}

function copyLink(){
alert("Invite Link Copied!");
}
</script>
<style>
body{
  padding-bottom: 30px;   /* bottom nav के लिए space */
}
</style>
</body>
 </html>
