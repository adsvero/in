<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | ADSVERO</title>

<!-- ✅ LOGIN CHECK (DO NOT MOVE / DO NOT CHANGE) -->
<script>
  const isLoggedIn = localStorage.getItem("isLoggedIn");
  if (isLoggedIn !== "true") {
    window.location.replace("login.html");
  }
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
  background:#f2f2f2;
  padding-bottom:90px;
}
.header{
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
  padding:20px;
  color:#fff;
  border-bottom-left-radius:22px;
  border-bottom-right-radius:22px;
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header img{height:32px;}
.balance{
  background:rgba(255,255,255,.25);
  padding:6px 14px;
  border-radius:20px;
  font-weight:700;
}
.banner{
  margin-top:14px;
  border-radius:16px;
  overflow:hidden;
}
.banner img{width:100%;display:block;}

.menu{
  display:flex;
  justify-content:space-between;
  margin:16px;
}
.menu-item{
  width:23%;
  background:#fff;
  border-radius:14px;
  padding:14px 0;
  text-align:center;
  box-shadow:0 10px 20px rgba(0,0,0,.08);
}
.menu-item img{width:34px;margin-bottom:6px;}
.menu-item span{display:block;font-size:12px;font-weight:700;}

.section{
  margin:16px;
}
.section h3{margin-bottom:6px;}
.section p{color:#777;font-size:14px;margin-bottom:12px;}

.task{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 10px 20px rgba(0,0,0,.08);
}
.task button{
  background:#ffc107;
  border:none;
  padding:10px 18px;
  border-radius:12px;
  font-weight:700;
}

.done{
  background:#28a745;
  color:#fff;
}

.bottom-nav{
  position:fixed;
  bottom:0;left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}
.nav-item{
  text-align:center;
  font-size:12px;
  font-weight:700;
  color:#999;
}
.nav-item.active{color:#ff3b3b;}
.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-top">
    <img src="Image/logo.png">
    <div class="balance">₹ 00.00</div>
  </div>

  <div class="banner">
    <img src="Image/Banner.png">
  </div>
</div>

<div class="menu">
  <div class="menu-item">
    <img src="Image/Watch.png">
    <span>Watch Ads</span>
  </div>
  <div class="menu-item">
    <img src="Image/Tasks.png">
    <span>Daily Tasks</span>
  </div>
  <div class="menu-item">
    <img src="Image/Rewards.png">
    <span>Rewards</span>
  </div>
  <div class="menu-item">
    <img src="Image/Withdraw.png">
    <span>Withdraw</span>
  </div>
</div>

<div class="section">
  <h3>Today's Tasks</h3>
  <p>Complete the ads & earn rewards</p>

  <div class="task">
    <div>
      <b>Ad Task 1</b><br>
      Watch Video (30 sec)
    </div>
    <button>START</button>
  </div>

  <div class="task">
    <div>
      <b>Ad Task 2</b><br>
      Completed
    </div>
    <button class="done">DONE</button>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active"><img src="Image/Home.png">Home</div>
  <div class="nav-item"><img src="Image/Task.png">Tasks</div>
  <div class="nav-item"><img src="Image/Wallet.png">Wallet</div>
  <div class="nav-item"><img src="Image/Name.png">Account</div>
</div>

</body>
</html>
