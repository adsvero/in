<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | ADSVERO</title>

<script>
if (localStorage.getItem("isLoggedIn") !== "true") {
  window.location.href = "login.html";
}
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
  background:#f2f2f2;
  padding-bottom:90px;
}

/* HEADER */
.header{
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
  padding:22px 16px 26px;
  color:#fff;
  border-bottom-left-radius:28px;
  border-bottom-right-radius:28px;
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header-top img{height:34px;}
.balance{
  background:rgba(255,255,255,.25);
  padding:6px 12px;
  border-radius:20px;
  font-weight:700;
}

/* BANNER */
.banner{
  margin-top:14px;
  width:100%;
  height:140px;
  border-radius:18px;
  overflow:hidden;
}
.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MENU */
.menu{
  display:flex;
  justify-content:space-between;
  margin:18px 14px;
}
.menu-item{
  width:22%;
  background:#fff;
  border-radius:16px;
  padding:14px 8px;
  text-align:center;
  box-shadow:0 8px 18px rgba(0,0,0,.08);
}
.menu-item img{width:36px;margin-bottom:6px;}
.menu-item span{font-size:13px;font-weight:700;display:block;}

/* TASKS */
.section{
  margin:10px 14px;
}
.section h3{font-size:18px;margin-bottom:4px;}
.section p{color:#777;font-size:14px;margin-bottom:12px;}

.task{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 10px 20px rgba(0,0,0,.08);
}
.task-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.task-title{font-weight:700;}
.task-sub{font-size:14px;color:#777;margin-top:4px;}
.start-btn{
  background:#ffc107;
  border:none;
  border-radius:12px;
  padding:10px 16px;
  font-weight:700;
}
.done-btn{
  background:#28a745;
  color:#fff;
  border:none;
  border-radius:12px;
  padding:10px 16px;
  font-weight:700;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}
.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}
.nav-item.active{color:#ff3b3b;}
.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-top">
    <img src="Image/logo.png">
    <div class="balance">₹ 0.00</div>
  </div>

  <div class="banner">
    <img src="Image/Banner.png">
  </div>
</div>

<div class="menu">
  <div class="menu-item">
    <img src="Image/Watch.png">
    <span>Watch Ads</span>
  </div>
  <div class="menu-item">
    <img src="Image/Tasks.png">
    <span>Daily Tasks</span>
  </div>
  <div class="menu-item">
    <img src="Image/Rewards.png">
    <span>Rewards</span>
  </div>
  <div class="menu-item">
    <img src="Image/Withdraw.png">
    <span>Withdraw</span>
  </div>
</div>

<div class="section">
  <h3>Today's Tasks</h3>
  <p>Complete the ads & earn rewards</p>

  <div class="task">
    <div class="task-row">
      <div>
        <div class="task-title">Ad Task 1</div>
        <div class="task-sub">Watch Video (30 sec)</div>
      </div>
      <button class="start-btn">START</button>
    </div>
  </div>

  <div class="task">
    <div class="task-row">
      <div>
        <div class="task-title">Ad Task 2</div>
        <div class="task-sub">Completed</div>
      </div>
      <button class="done-btn">DONE</button>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active"><img src="Image/Home.png">Home</div>
  <div class="nav-item"><img src="Image/Task.png">Tasks</div>
  <div class="nav-item"><img src="Image/Wallet.png">Wallet</div>
  <div class="nav-item"><img src="Image/Name.png">Account</div>
</div>

</body>
</html>
