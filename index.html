<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADSVERO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f2f2f2;
  overflow-x:hidden;
}

/* ===== MOBILE CONTAINER LOCK ===== */
#page{
  max-width:430px;
  width:100%;
  margin:0 auto;
}

/* ===== HEADER ===== */
.header{
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
  padding:18px 0 20px;
  color:#fff;
  border-bottom-left-radius:32px;
  border-bottom-right-radius:32px;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:18px;
}

.brand img{ height:26px; }

.wallet-badge{
  background:rgba(255,255,255,.25);
  padding:8px 12px;
  border-radius:20px;
  font-weight:700;
}

/* ===== FULL WIDTH BANNER ===== */
.banner{
  margin-top:12px;
  width:100%;
  height:160px;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:0;
}

/* ===== 4 SQUARE BUTTONS (MAIN FIX) ===== */
.menu{
  margin:12px 10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

/* 👉 MAIN FIX — THIS MAKES EVERY BUTTON PERFECT SQUARE 👇 */
.menu-item{
  border-radius:16px;
  padding:12px 6px;
  text-align:center;
  box-shadow:0 10px 22px rgba(0,0,0,.12);
  color:white;
  aspect-ratio: 1 / 1;   /* 🔥 SQUARE FIX */
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* exact colors like reference image */
.menu-item.watch{ background:#ff3b3b; }
.menu-item.tasks{ background:#2f80ff; }
.menu-item.rewards{ background:#2ea44f; }
.menu-item.withdraw{ background:#f2a60c; }

.menu-item img{
  width:40px;
  height:40px;
  margin-bottom:6px;
}

.menu-item span{
  font-size:13px;
  font-weight:700;
}

/* ===== TASK SECTION ===== */
.section{
  padding:16px;
}

.section h3{
  font-size:20px;
  margin-bottom:6px;
}

.section p{
  color:#777;
  margin-bottom:12px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 10px 22px rgba(0,0,0,.12);
}

.task-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.task-title{ font-weight:700; }

.task-sub{
  color:#777;
  font-size:14px;
  margin-top:4px;
}

.btn-start{
  background:#ffc107;
  border:none;
  border-radius:14px;
  padding:10px 18px;
  font-weight:700;
}

.btn-done{
  background:#2ea44f;
  color:#fff;
  border:none;
  border-radius:14px;
  padding:10px 18px;
  font-weight:700;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-item.active{ color:#ff3b3b; }
</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="brand">
      <img src="Image/logo.png">
      <span>ADSVERO</span>
    </div>
    <div class="wallet-badge">
      ₹ <span id="walletAmt">0.00</span>
    </div>
  </div>

  <div class="banner">
    <img src="Image/Banner.png">
  </div>
</div>

<!-- 4 PERFECT SQUARE BUTTONS -->
<div class="menu">
  <div class="menu-item watch">
    <img src="Image/Watch.png">
    <span>Watch Ads</span>
  </div>

  <div class="menu-item tasks">
    <img src="Image/Tasks.png">
    <span>Daily Tasks</span>
  </div>

  <div class="menu-item rewards">
    <img src="Image/Rewards.png">
    <span>Rewards</span>
  </div>

  <div class="menu-item withdraw">
    <img src="Image/Withdraw.png">
    <span>Withdraw</span>
  </div>
</div>

<!-- TASK SECTION -->
<div class="section">
  <h3>Today’s Tasks</h3>
  <p>Complete the ads & earn rewards</p>

  <div class="card">
    <div class="task-row">
      <div>
        <div class="task-title">Ad Task 1</div>
        <div class="task-sub">Watch Video (30 sec)</div>
      </div>
      <button class="btn-start">START</button>
    </div>
  </div>

  <div class="card">
    <div class="task-row">
      <div>
        <div class="task-title">Ad Task 2</div>
        <div class="task-sub">Completed</div>
      </div>
      <button class="btn-done">✓ DONE</button>
    </div>
  </div>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active">
    <img src="Image/Home.png">Home
  </div>
  <div class="nav-item">
    <img src="Image/Task.png">Tasks
  </div>
  <div class="nav-item">
    <img src="Image/Wallet.png">Wallet
  </div>
  <div class="nav-item">
    <img src="Image/Name.png">Account
  </div>
</div>

</body>
  </html>
