<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADSVERO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f2f2f2;
  overflow-x:hidden;
}

/* ===== MOBILE CONTAINER ===== */
#page{
  max-width:430px;
  width:100%;
  margin:0 auto;
}

/* ===== HEADER ===== */
.header{
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a) !important;
  padding:18px 0 3px;
  color:#fff;
  border-bottom-left-radius:32px;
  border-bottom-right-radius:32px;
  position:relative;
  z-index:10;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:20px;
}

/* Logo size (same जैसा तुम चाहते हो) */
.brand img{ height:36px; }

.wallet-badge{
  background:rgba(255,255,255,.25);
  padding:8px 12px;
  border-radius:20px;
  font-weight:700;
}

/* ===== BANNER (RED BACKGROUND REMOVED) ===== */
.banner{
  margin-top:8px;
  width:100%;
  height:auto;
  background:none;
}

#page{
  background:white;
}
.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:0;
}

/* ===== 4 BUTTONS (SMALLER + SQUARE) ===== */
.menu{
  margin:10px 8px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;      /* gap कम किया */
}

/* Buttons अब और छोटे + square */
.menu-item{
  border-radius:14px;
  padding:8px 6px;        /* padding कम */
  text-align:center;
  box-shadow:0 8px 18px rgba(0,0,0,.12);
  color:white;
  aspect-ratio: 1 / 1;     /* perfect square */
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* exact colors */
.menu-item.watch{ background:#ff3b3b; }
.menu-item.tasks{ background:#2f80ff; }
.menu-item.rewards{ background:#2ea44f; }
.menu-item.withdraw{ background:#f2a60c; }

.menu-item img{
  width:32px;   /* और छोटा */
  height:32px;
  margin-bottom:4px;
}

.menu-item span{
  font-size:12px;
  font-weight:700;
}

/* ===== TASK SECTION ===== */
.section{
  padding:14px;
}

.section h3{
  font-size:20px;
  margin-bottom:6px;
}

.section p{
  color:#777;
  margin-bottom:12px;
}

/* 👉 AD TASK 1 COMPLETELY REMOVED — कोई card नहीं रखा */

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-item.active{ color:#ff3b3b; }
</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="brand">
      <img src="Image/logo.png">
      <span></span>
    </div>
    <div class="wallet-badge">
      ₹ <span id="walletAmt">0.00</span>
    </div>
  </div>

  <!-- Banner without red background -->
  <div class="banner">
    <img src="Image/Banner.png">
  </div>
</div>

<!-- 4 SMALL SQUARE BUTTONS -->
<div class="menu">
  <div class="menu-item watch">
    <img src="Image/Watch.png">
    <span>Watch Ads</span>
  </div>

  <div class="menu-item tasks">
    <img src="Image/Tasks.png">
    <span>Daily Tasks</span>
  </div>

  <div class="menu-item rewards">
    <img src="Image/Rewards.png">
    <span>Rewards</span>
  </div>

  <div class="menu-item withdraw">
    <img src="Image/Withdraw.png">
    <span>Withdraw</span>
  </div>
</div>

<!-- TASK TITLE ONLY (NO CARDS) -->
<div class="section">
  <h3>Plan Purchase Now</h3>
  <p>Complete the ads & earn rewards</p>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active">
    <img src="Image/Home.png">Home
  </div>
  <div class="nav-item">
    <img src="Image/Task.png">Tasks
  </div>
  <div class="nav-item">
    <img src="Image/Wallet.png">Wallet
  </div>
  <div class="nav-item">
    <img src="Image/Name.png">Account
  </div>
</div>

</body>
</html>
