<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADSVERO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

/* ======= MOBILE CONTAINER (MOST IMPORTANT FIX) ======= */
body{
  background:#f2f2f2;
  display:flex;
  justify-content:center;
}

#app{
  width:100%;
  max-width:420px;      /* 🔥 MOBILE SIZE LOCK */
  min-height:100vh;
  background:#fff;
  box-shadow:0 0 20px rgba(0,0,0,.15);
  position:relative;
}

/* ===== HEADER ===== */
.header{
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
  padding:18px 16px;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
}

.brand img{
  height:26px;
}

.wallet-badge{
  background:rgba(255,255,255,.25);
  padding:8px 12px;
  border-radius:20px;
  font-weight:700;
}

/* ===== FULL BANNER ===== */
.banner{
  width:100%;
  height:160px;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:0;
}

/* ===== MENU BUTTONS (BOX SIZE FIX) ===== */
.menu{
  margin:16px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

/* BOX BUTTON */
.menu-item{
  border-radius:18px;
  width:80px;      /* 🔥 square lock */
  height:80px;     /* 🔥 square lock */
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  box-shadow:0 10px 22px rgba(0,0,0,.12);
}

/* EXACT COLORS LIKE YOUR IMAGE */
.menu-item.watch{background:#ff3b3b;}
.menu-item.tasks{background:#2f80ff;}
.menu-item.rewards{background:#2ea44f;}
.menu-item.withdraw{background:#f2a60c;}

.menu-item img{
  width:42px;
  height:42px;
  display:block;
  margin:0 auto 6px;
}

.menu-item span{
  font-size:13px;
  font-weight:700;
}

/* ===== TASK SECTION ===== */
.section{
  margin:16px;
}

.section h3{
  font-size:20px;
  margin-bottom:6px;
}

.section p{
  color:#777;
  margin-bottom:12px;
}

/* TASK CARD */
.card{
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 10px 22px rgba(0,0,0,.12);
}

.task-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.task-title{font-weight:700;}
.task-sub{color:#777;font-size:14px;margin-top:4px;}

.btn-start{
  background:#ffc107;
  border:none;
  border-radius:14px;
  padding:10px 18px;
  font-weight:700;
}

.btn-done{
  background:#2ea44f;
  color:white;
  border:none;
  border-radius:14px;
  padding:10px 18px;
  font-weight:700;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:420px;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-active{
  color:#ff3b3b;
}
</style>
</head>

<body>

<div id="app">

<!-- HEADER -->
<div class="header">
  <div class="brand">
    <img src="Image/logo.png">
    <span>ADSVERO</span>
  </div>
  <div class="wallet-badge">₹ 0.00</div>
</div>

<!-- FULL SIZE BANNER -->
<div class="banner">
  <img src="Image/Banner.png">
</div>

<!-- 4 COLOR BOX BUTTONS -->
<div class="menu">
  <div class="menu-item watch">
    <img src="Image/Watch.png">
    <span>Watch Ads</span>
  </div>

  <div class="menu-item tasks">
    <img src="Image/Tasks.png">
    <span>Daily Tasks</span>
  </div>

  <div class="menu-item rewards">
    <img src="Image/Rewards.png">
    <span>Rewards</span>
  </div>

  <div class="menu-item withdraw">
    <img src="Image/Withdraw.png">
    <span>Withdraw</span>
  </div>
</div>

<!-- TODAY TASKS -->
<div class="section">
  <h3>Today’s Tasks</h3>
  <p>Complete the ads & earn rewards</p>

  <div class="card">
    <div class="task-row">
      <div>
        <div class="task-title">Ad Task 1</div>
        <div class="task-sub">Watch Video (30 sec)</div>
      </div>
      <button class="btn-start">START</button>
    </div>
  </div>

  <div class="card">
    <div class="task-row">
      <div>
        <div class="task-title">Ad Task 2</div>
        <div class="task-sub">Completed</div>
      </div>
      <button class="btn-done">✓ DONE</button>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item nav-active">
    <img src="Image/Home.png">Home
  </div>
  <div class="nav-item">
    <img src="Image/Task.png">Tasks
  </div>
  <div class="nav-item">
    <img src="Image/Wallet.png">Wallet
  </div>
  <div class="nav-item">
    <img src="Image/Name.png">Account
  </div>
</div>

</div>

</body>
</html>
