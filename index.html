<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | ADSVERO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
  background:#f2f2f2;
}

/* ===== MOBILE WRAPPER (IMPORTANT FIX) ===== */
#page{
  max-width: 480px;      /* PHONE WIDTH */
  margin: 0 auto;        /* CENTER LOCK */
  background:#f2f2f2;
  min-height:100vh;
  padding-bottom:80px;
}

/* ===== HEADER ===== */
.header{
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
  padding:18px 0 14px;
  color:white;
  border-bottom-left-radius:32px;
  border-bottom-right-radius:32px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:18px;
}

.brand img{height:26px;}

.wallet-badge{
  background:rgba(255,255,255,.25);
  padding:8px 12px;
  border-radius:20px;
  font-weight:700;
}

/* ===== FULL SIZE BANNER ===== */
.banner{
  margin-top:12px;
  width:100%;
  height:160px;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== MENU BUTTONS (SQUARE MOBILE) ===== */
.menu{
  margin:14px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.menu-item{
  border-radius:16px;
  padding:14px 6px;
  text-align:center;
  box-shadow:0 10px 22px rgba(0,0,0,.12);
  color:white;
  aspect-ratio: 1 / 1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* EXACT COLORS LIKE YOUR IMAGE */
.menu-item.watch{background:#ff3b3b;}
.menu-item.tasks{background:#2f80ff;}
.menu-item.rewards{background:#2ea44f;}
.menu-item.withdraw{background:#f2a60c;}

.menu-item img{
  width:52px;
  height:52px;
  display:block;
  margin-bottom:6px;
}

.menu-item span{
  font-size:13px;
  font-weight:700;
}

/* ===== TASK SECTION ===== */
.section{
  margin:14px;
}

.section h3{
  font-size:20px;
  margin-bottom:4px;
}

.section p{
  color:#777;
  margin-bottom:10px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 10px 22px rgba(0,0,0,.12);
}

.task-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.btn-start{
  background:#ffc107;
  border:none;
  border-radius:14px;
  padding:8px 16px;
  font-weight:700;
}

.btn-done{
  background:#2ea44f;
  color:white;
  border:none;
  border-radius:14px;
  padding:8px 16px;
  font-weight:700;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-item.active{
  color:#ff3b3b;
}
</style>

<script>
if(localStorage.getItem("isLoggedIn") !== "true"){
  window.location.href = "login.html";
}
</script>

</head>

<body>

<div id="page">

<div class="header">
  <div class="header-top">
    <div class="brand">
      <img src="Image/logo.png" alt="ADSVERO">
      <span>ADSVERO</span>
    </div>
    <div class="wallet-badge">
      ₹ <span id="walletAmt">0.00</span>
    </div>
  </div>

  <div class="banner">
    <img src="Image/Banner.png" alt="Earn Rewards">
  </div>
</div>

<div class="menu">
  <div class="menu-item watch">
    <img src="Image/Watch.png">
    <span>Watch Ads</span>
  </div>

  <div class="menu-item tasks">
    <img src="Image/Tasks.png">
    <span>Daily Tasks</span>
  </div>

  <div class="menu-item rewards">
    <img src="Image/Rewards.png">
    <span>Rewards</span>
  </div>

  <div class="menu-item withdraw">
    <img src="Image/Withdraw.png">
    <span>Withdraw</span>
  </div>
</div>

<div class="section">
  <h3>Today’s Tasks</h3>
  <p>Complete the ads & earn rewards</p>

  <div class="card">
    <div class="task-row">
      <div>
        <div>Ad Task 1</div>
        <div>Watch Video (30 sec)</div>
      </div>
      <button class="btn-start">START</button>
    </div>
  </div>

  <div class="card">
    <div class="task-row">
      <div>
        <div>Ad Task 2</div>
        <div>Completed</div>
      </div>
      <button class="btn-done">DONE</button>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active">
    <img src="Image/Home.png">Home
  </div>
  <div class="nav-item">
    <img src="Image/Task.png">Tasks
  </div>
  <div class="nav-item">
    <img src="Image/Wallet.png">Wallet
  </div>
  <div class="nav-item">
    <img src="Image/Name.png">Account
  </div>
</div>

<script>
document.getElementById("walletAmt").innerText =
  localStorage.getItem("walletAmount") || "0.00";
</script>

</div>
</body>
</html>
