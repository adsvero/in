<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | ADSVERO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:#f2f2f2;
  padding-bottom:80px;
}

/* 🔐 LOGIN CHECK FIX */
.hidden{display:none;}

/* HEADER */
.header{
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
  color:#fff;
  padding:16px;
  border-bottom-left-radius:22px;
  border-bottom-right-radius:22px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:700;
}

.logo img{width:28px;}

.balance{
  background:rgba(255,255,255,.25);
  padding:6px 14px;
  border-radius:20px;
  font-weight:700;
}

/* BANNER */
.banner{
  background:#ff4a4a;
  margin:16px;
  border-radius:18px;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fff;
}

.banner img{
  width:120px;
  border-radius:12px;
}

/* ICON MENU */
.menu{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:0 16px;
}

.menu-item{
  background:#fff;
  border-radius:16px;
  padding:12px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
  font-size:13px;
  font-weight:600;
}

.menu-item img{
  width:36px;
  margin-bottom:6px;
}

/* TASKS */
.section{
  margin:16px;
}

.section h3{
  margin-bottom:6px;
}

.task{
  background:#fff;
  border-radius:16px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.task small{color:#777;}

.start{
  background:#ffc107;
  border:none;
  padding:8px 18px;
  border-radius:12px;
  font-weight:700;
}

.done{
  background:#28a745;
  color:#fff;
  border:none;
  padding:8px 18px;
  border-radius:12px;
  font-weight:700;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.active{
  color:#ff3b3b;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN CHECK -->
<script>
if(localStorage.getItem("loggedIn") !== "true"){
  window.location.href = "login.html";
}
</script>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="logo">
      <img src="Image/logo.png">
      ADSVERO
    </div>
    <div class="balance">₹ 0.00</div>
  </div>
</div>

<!-- BANNER -->
<div class="banner">
  <div>
    <h2>Watch Ads & Earn Rewards!</h2>
    <p>Complete daily tasks & get paid</p>
  </div>
  <img src="Image/Banner.png">
</div>

<!-- MENU -->
<div class="menu">
  <div class="menu-item">
    <img src="Image/Watch.png">
    Watch Ads
  </div>
  <div class="menu-item">
    <img src="Image/Tasks.png">
    Daily Tasks
  </div>
  <div class="menu-item">
    <img src="Image/Rewards.png">
    Rewards
  </div>
  <div class="menu-item">
    <img src="Image/Withdraw.png">
    Withdraw
  </div>
</div>

<!-- TASKS -->
<div class="section">
  <h3>Today's Tasks</h3>
  <p>Complete the ads & earn rewards</p>

  <div class="task">
    <div>
      <b>Ad Task 1</b><br>
      <small>Watch Video (30 sec)</small>
    </div>
    <button class="start">START</button>
  </div>

  <div class="task">
    <div>
      <b>Ad Task 2</b><br>
      <small>Completed</small>
    </div>
    <button class="done">DONE</button>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active">
    <img src="Image/Home.png">
    Home
  </div>
  <div class="nav-item">
    <img src="Image/Tasks.png">
    Tasks
  </div>
  <div class="nav-item">
    <img src="Image/Wallet.png">
    Wallet
  </div>
  <div class="nav-item">
    <img src="Image/Name.png">
    Account
  </div>
</div>

</body>
    </html>
