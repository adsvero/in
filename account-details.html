<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account | ADSVERO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f2f2f2;
}

#page{
max-width:430px;
margin:auto;
background:white;
min-height:100vh;
padding-bottom:90px;
}

/* HEADER */
.header{
background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
padding:18px 0;
color:#fff;
border-bottom-left-radius:32px;
border-bottom-right-radius:32px;
}

.header-top{
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
}

.brand{
display:flex;
align-items:center;
gap:8px;
font-weight:700;
font-size:20px;
}

.brand img{
height:36px;
}

.wallet-badge{
background:rgba(255,255,255,.25);
padding:8px 12px;
border-radius:20px;
font-weight:700;
}

/* PROFILE CARD */
.profile-card{
background:#fff;
margin:16px;
border-radius:18px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
overflow:hidden;
}

.profile-top{
display:flex;
align-items:center;
gap:12px;
padding:16px;
border-bottom:1px solid #eee;
}

.profile-avatar{
width:56px;
height:56px;
border-radius:50%;
background:#ff3b3b;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:700;
}

.profile-name{
font-weight:700;
}

.profile-email{
color:#777;
font-size:14px;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 16px;
border-bottom:1px solid #eee;
}

.label{
color:#777;
font-size:14px;
}

.value{
font-weight:600;
}

.update-btn{
padding:6px 14px;
border-radius:10px;
border:1px solid #ddd;
background:#f6f6f6;
cursor:pointer;
}

/* PASSWORD */
.section{
margin:16px;
}

.section h3{
margin-bottom:12px;
}

.input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
margin-bottom:12px;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:#fff;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
}

.nav-item{
text-align:center;
font-size:12px;
color:#999;
}

.nav-item img{
width:26px;
display:block;
margin:auto;
margin-bottom:4px;
}

.nav-item.active{
color:#ff3b3b;
font-weight:700;
}
</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="header">
<div class="header-top">
<div class="brand">
<img src="Image/logo.png">
<span></span>
</div>
<div class="wallet-badge" id="walletBalance">USA</div>
</div>
</div>

<h2 style="padding:16px;">Account Details</h2>

<!-- PROFILE CARD -->
<div class="profile-card">

<div class="profile-top">
<div class="profile-avatar" id="avatarLetter">A</div>
<div>
<div class="profile-name" id="topName">Himanshu</div>
<div class="profile-email" id="topEmail">himanshu@gmail.com</div>
</div>
</div>

<div class="row">
<div>
<div class="label">Name</div>
<div class="value" id="nameValue">Himanshu</div>
</div>
<button class="update-btn" onclick="updateName()">Update</button>
</div>

<div class="row">
<div>
<div class="label">Email Address</div>
<div class="value" id="emailValue">himanshu@gmail.com</div>
</div>
<button class="update-btn" onclick="updateEmail()">Update</button>
</div>

<div class="row" style="border-bottom:none;">
<div>
<div class="label">Phone Number</div>
<div class="value" id="phoneValue">9876543210</div>
</div>
<button class="update-btn" onclick="updatePhone()">Update</button>
</div>

</div>

<!-- PASSWORD -->
<div class="section">
<h3>Change Password</h3>

<input class="input" placeholder="Enter current password">
<input class="input" placeholder="Enter new password">
<input class="input" placeholder="Confirm new password">

<button style="width:100%;padding:14px;border:none;border-radius:14px;background:#ff3b3b;color:#fff;font-weight:700;">
Update Password
</button>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<div class="nav-item">
<a href="index.html" style="text-decoration:none;color:inherit;">
<img src="Image/Home.png">Home
</a>
</div>

<div class="nav-item">
<a href="tasks.html" style="text-decoration:none;color:inherit;">
<img src="Image/Task.png">Tasks
</a>
</div>

<div class="nav-item">
<a href="wallet.html" style="text-decoration:none;color:inherit;">
<img src="Image/Wallet.png">Wallet
</a>
</div>

<div class="nav-item active">
<a href="account.html" style="text-decoration:none;color:inherit;">
<img src="Image/Name.png">Account
</a>
</div>
</div>

<script>
/* LOAD SAVED DATA */
function loadProfile(){
const name = localStorage.getItem("userName") || "Himanshu";
const email = localStorage.getItem("userEmail") || "himanshu@gmail.com";
const phone = localStorage.getItem("userPhone") || "9876543210";
const balance = localStorage.getItem("walletBalance") || "0.00";

document.getElementById("nameValue").innerText = name;
document.getElementById("emailValue").innerText = email;
document.getElementById("phoneValue").innerText = phone;

document.getElementById("topName").innerText = name;
document.getElementById("topEmail").innerText = email;

document.getElementById("walletBalance").innerText = "₹"+balance;

/* avatar letter */
document.getElementById("avatarLetter").innerText = name.charAt(0).toUpperCase();
}

/* UPDATE FUNCTIONS */
function updateName(){
let n = prompt("Enter new name");
if(n){
localStorage.setItem("userName", n);
loadProfile();
}
}

function updateEmail(){
let e = prompt("Enter new email");
if(e){
localStorage.setItem("userEmail", e);
loadProfile();
}
}

function updatePhone(){
let p = prompt("Enter phone number");
if(p){
localStorage.setItem("userPhone", p);
loadProfile();
}
}

/* INIT */
loadProfile();
</script>

</body>
  </html>
