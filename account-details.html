<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Details | ADSVERO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f2f2f2;
}

/* MOBILE CONTAINER */
#page{
max-width:430px;
margin:auto;
background:white;
min-height:100vh;
padding-bottom:80px;
}

/* HEADER */
.header{
background:linear-gradient(90deg,#ff3b3b,#ff6a6a);
color:white;
padding:18px 16px;
border-bottom-left-radius:32px;
border-bottom-right-radius:32px;
}

.header-top{
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
display:flex;
align-items:center;
gap:8px;
font-weight:700;
font-size:20px;
}

.brand img{
height:34px;
}

.wallet-badge{
background:rgba(255,255,255,.25);
padding:6px 12px;
border-radius:20px;
font-weight:700;
}

/* SECTION */
.section{
padding:16px;
}

.title{
font-size:22px;
font-weight:700;
margin-bottom:12px;
}

/* PROFILE CARD */
.profile-card{
background:#fff;
border-radius:18px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
overflow:hidden;
margin-bottom:18px;
}

.profile-top{
display:flex;
align-items:center;
gap:12px;
padding:16px;
border-bottom:1px solid #eee;
}

.avatar{
width:54px;
height:54px;
border-radius:50%;
background:linear-gradient(135deg,#ff3b3b,#ff6a6a);
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
font-size:22px;
}

.profile-name{
font-weight:700;
}

.profile-email{
color:#777;
font-size:14px;
}

/* ROW */
.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 16px;
border-bottom:1px solid #eee;
}

.row:last-child{
border-bottom:none;
}

.row-title{
font-size:14px;
color:#666;
}

.row-value{
font-size:18px;
font-weight:600;
margin-top:2px;
}

.update-btn{
padding:8px 14px;
border-radius:10px;
border:1px solid #ddd;
background:#f5f5f5;
cursor:pointer;
}

/* PASSWORD CARD */
.password-card{
background:#fff;
border-radius:18px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
padding:16px;
}

.label{
font-weight:600;
margin:10px 0 6px;
}

.input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

.update-pass{
margin-top:16px;
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#ff3b3b,#ff6a6a);
color:white;
font-weight:700;
font-size:16px;
cursor:pointer;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:white;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
}

.nav-item{
text-align:center;
font-size:12px;
color:#999;
font-weight:600;
}

.nav-item img{
width:26px;
display:block;
margin:auto;
margin-bottom:4px;
}

.nav-item.active{
color:#ff3b3b;
}
</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="header">
<div class="header-top">
<div class="brand">
<img src="Image/logo.png">
<span></span>
</div>
<div class="wallet-badge">USA</div>
</div>
</div>

<div class="section">

<div class="title">Account Details</div>

<!-- PROFILE CARD -->
<div class="profile-card">

<div class="profile-top">
<div class="avatar">A</div>
<div>
<div class="profile-name" id="topName">Himanshu</div>
<div class="profile-email" id="topEmail">himanshu@gmail.com</div>
</div>
</div>

<div class="row">
<div>
<div class="row-title">Name</div>
<div class="row-value" id="nameValue">Himanshu</div>
</div>
<button class="update-btn" onclick="updateName()">Update</button>
</div>

<div class="row">
<div>
<div class="row-title">Email Address</div>
<div class="row-value" id="emailValue">himanshu@gmail.com</div>
</div>
<button class="update-btn" onclick="updateEmail()">Update</button>
</div>

<div class="row">
<div>
<div class="row-title">Phone Number</div>
<div class="row-value" id="phoneValue">+91 9876543210</div>
</div>
<button class="update-btn" onclick="updatePhone()">Update</button>
</div>

</div>

<!-- PASSWORD -->
<div class="title">Change Password</div>

<div class="password-card">

<div class="label">Current Password</div>
<input type="password" id="currentPass" class="input" placeholder="Enter current password">

<div class="label">New Password</div>
<input type="password" id="newPass" class="input" placeholder="Enter new password">

<div class="label">Confirm New Password</div>
<input type="password" id="confirmPass" class="input" placeholder="Confirm new password">

<button class="update-pass" onclick="changePassword()">Update Password</button>

</div>

</div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<div class="nav-item">
<a href="index.html" style="text-decoration:none;color:inherit;">
<img src="Image/Home.png">Home
</a>
</div>

<div class="nav-item">
<a href="tasks.html" style="text-decoration:none;color:inherit;">
<img src="Image/Task.png">Tasks
</a>
</div>

<div class="nav-item">
<a href="wallet.html" style="text-decoration:none;color:inherit;">
<img src="Image/Wallet.png">Wallet
</a>
</div>

<div class="nav-item active">
<a href="account.html" style="text-decoration:none;color:inherit;">
<img src="Image/Name.png">Account
</a>
</div>
</div>

<script>

/* LOAD SAVED USER */
let name = localStorage.getItem("userName") || "Himanshu";
let email = localStorage.getItem("userEmail") || "himanshu@gmail.com";
let phone = localStorage.getItem("userPhone") || "+91 9876543210";

document.getElementById("nameValue").innerText = name;
document.getElementById("emailValue").innerText = email;
document.getElementById("phoneValue").innerText = phone;

/* UPDATE FUNCTIONS */
function updateName(){
let n = prompt("Enter new name");
if(n){
localStorage.setItem("userName",n);
location.reload();
}
}

function updateEmail(){
let e = prompt("Enter new email");
if(e){
localStorage.setItem("userEmail",e);
location.reload();
}
}

function updatePhone(){
let p = prompt("Enter new phone");
if(p){
localStorage.setItem("userPhone",p);
location.reload();
}
}

/* PASSWORD */
function changePassword(){
let c = document.getElementById("currentPass").value;
let n = document.getElementById("newPass").value;
let cf = document.getElementById("confirmPass").value;

let saved = localStorage.getItem("userPass") || "1234";

if(c !== saved){
alert("Current password incorrect");
return;
}

if(n.length < 4){
alert("Password too short");
return;
}

if(n !== cf){
alert("Password not match");
return;
}

localStorage.setItem("userPass",n);
alert("Password updated successfully");
document.getElementById("currentPass").value="";
document.getElementById("newPass").value="";
document.getElementById("confirmPass").value="";
}

</script>

</body>
</html>
