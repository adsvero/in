<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video & Earn</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f2f2f2;
}

/* HEADER */
.header{
background:linear-gradient(90deg,#ff3b3b,#ff6b6b);
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 15px;
}

.header img{
height:28px;
}

.balance{
background:white;
color:#ff3b3b;
padding:6px 12px;
border-radius:20px;
font-weight:bold;
}

/* CONTENT */
.container{
padding:20px;
padding-bottom:90px;
}

h2{
margin-top:10px;
}

/* VIDEO CARD */
.video-box{
position:relative;
border-radius:15px;
overflow:hidden;
background:black;
}

.video-box video{
width:100%;
border-radius:15px;
}

/* BUTTONS */
.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
margin-top:15px;
}

.red{
background:#ff3b3b;
color:white;
}

.yellow{
background:#f5a300;
color:white;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-item.active{ color:#ff3b3b; }
}
</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="brand">
      <img src="Image/logo.png">
      <span></span>
    </div>
    <div class="wallet-badge">₹ 0.00</div>
  </div>
</div>

<div class="container">

<h2>Watch Video & Earn</h2>

<div class="video-box">
<video id="adVideo" controls poster="Image/sale.jpg">
<source src="Video/Ads.mp4" type="video/mp4">
</video>
</div>

<button class="btn red">Continue Watching</button>
<button class="btn yellow">Complete in: 25 seconds</button>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item">
    <a href="index.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Home.png">Home
    </a>
  </div>

  <div class="nav-item active">
    <a href="tasks.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Task.png">Tasks
    </a>
  </div>

  <div class="nav-item">
    <a href="wallet.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Wallet.png">Wallet
    </a>
  </div>

  <div class="nav-item">
    <a href="account.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Name.png">Account
    </a>
  </div>
</div>

  
</body>
</html>
