<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video & Earn</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f2f2f2;
}

/* HEADER */
.header{
background:linear-gradient(to right,#ff3b3b,#ff6b6b);
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
font-weight:bold;
}

.balance{
background:white;
color:#ff3b3b;
padding:6px 14px;
border-radius:20px;
font-weight:bold;
}

/* PAGE */
.container{
padding:15px;
}

h2{
margin-top:10px;
}

/* VIDEO BOX */
.video-box{
position:relative;
width:100%;
border-radius:15px;
overflow:hidden;
background:black;
}

video{
width:100%;
border-radius:15px;
display:none;
}

.thumbnail{
width:100%;
display:block;
border-radius:15px;
}

.play-btn{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90px;
cursor:pointer;
}

/* BUTTONS */
.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
margin-top:15px;
}

.continue{
background:#ff3b3b;
color:white;
}

.timer{
background:#f4a000;
color:white;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:8px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}

.nav-item{
text-align:center;
font-size:12px;
color:#777;
font-weight:bold;
}

.nav-item img{
width:24px;
display:block;
margin:auto;
}

.active{
color:#ff3b3b;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div>ADSVERO</div>
<div class="balance">₹00.0</div>
</div>

<div class="container">

<h2>Watch Video & Earn</h2>

<!-- VIDEO AREA -->
<div class="video-box">

<img src="thumbnail.jpg" class="thumbnail" id="thumb">

<img src="play.png" class="play-btn" id="playBtn" onclick="playVideo()">

<video id="myVideo" controls>
<source src="Ads.mp4" type="video/mp4">
</video>

</div>

<button class="btn continue">Continue Watching</button>

<button class="btn timer">Complete in: 25 seconds</button>

</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">

<div class="nav-item">
<img src="Image/Home.png">
Home
</div>

<div class="nav-item active">
<img src="Image/Tasks.png">
Tasks
</div>

<div class="nav-item">
<img src="Image/Wallet.png">
Wallet
</div>

<div class="nav-item">
<img src="Image/Account.png">
Account
</div>

</div>

<script>
function playVideo(){
document.getElementById("thumb").style.display="none";
document.getElementById("playBtn").style.display="none";
document.getElementById("myVideo").style.display="block";
document.getElementById("myVideo").play();
}
</script>

</body>
</html>
