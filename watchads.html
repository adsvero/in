<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch & Earn</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f2f2f2;
}

/* HEADER */
.header{
background:linear-gradient(90deg,#ff3b3b,#ff6b6b);
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
font-weight:bold;
}

.balance{
background:white;
color:#ff3b3b;
padding:6px 12px;
border-radius:20px;
font-weight:bold;
}

/* CONTENT */
.container{
padding:15px;
padding-bottom:90px;
}

h2{
margin-top:10px;
}

/* VIDEO BOX */
.player-box{
position:relative;
width:100%;
max-width:420px;
margin:15px auto;
border-radius:15px;
overflow:hidden;
background:black;
aspect-ratio:16/9;
}

.player-box video{
width:100%;
height:100%;
}

/* CUSTOM PLAY BUTTON */
.custom-play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:50px;
color:white;
background:rgba(0,0,0,0.6);
width:80px;
height:80px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* BUTTONS */
.btn-red{
background:#ff3b3b;
color:white;
padding:15px;
border-radius:12px;
text-align:center;
margin:15px 0;
font-size:18px;
font-weight:bold;
}

.btn-yellow{
background:#f4a100;
color:white;
padding:15px;
border-radius:12px;
text-align:center;
font-size:18px;
font-weight:bold;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}

.nav-item{
text-align:center;
font-size:12px;
color:#888;
font-weight:bold;
}

.nav-item.active{
color:#ff3b3b;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div>ADSVERO</div>
<div class="balance">₹00.0</div>
</div>

<!-- CONTENT -->
<div class="container">

<h2>Watch Video & Earn</h2>

<div class="player-box">
<video id="myVideo" poster="thumb.jpg">
<source src="Ads.mp4" type="video/mp4">
</video>

<div class="custom-play" onclick="playVideo()">▶</div>
</div>

<div class="btn-red">
Continue Watching
</div>

<div class="btn-yellow">
Complete in: 25 seconds
</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<div class="nav-item" onclick="location.href='index.html'">
Home
</div>

<div class="nav-item active">
Tasks
</div>

<div class="nav-item" onclick="location.href='wallet.html'">
Wallet
</div>

<div class="nav-item" onclick="location.href='account.html'">
Account
</div>
</div>

<script>
function playVideo(){
var v = document.getElementById("myVideo");
v.play();
document.querySelector(".custom-play").style.display="none";
v.setAttribute("controls","controls");
}
</script>

</body>
</html>
