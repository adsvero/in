<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch & Earn</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f3f3f3;
}

/* ===== TOP BAR (APP STYLE) ===== */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:#ff3b3b;
padding:12px 14px;
position:fixed;
top:0;
width:100%;
z-index:999;
box-sizing:border-box;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* ===== CONTENT ===== */
.container{
margin-top:70px;
padding:15px;
}

/* ===== TITLE ===== */
.title{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

/* ===== FAKE VIDEO PLAYER (APP LOOK) ===== */
.player-box{
width:100%;
max-width:420px;
margin:auto;
background:black;
border-radius:14px;
overflow:hidden;
position:relative;
}

/* VIDEO THUMBNAIL */
.player-box img{
width:100%;
display:block;
}

/* RED PROGRESS BAR */
.progress-bar{
height:6px;
width:30%;
background:red;
}

/* PLAY ICON */
.play-btn{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:60px;
}

/* ===== BUTTONS ===== */
.btn-red{
width:100%;
max-width:420px;
margin:12px auto 6px auto;
display:block;
background:#ff3b3b;
color:white;
border:none;
padding:12px;
border-radius:10px;
font-size:16px;
}

.btn-yellow{
width:100%;
max-width:420px;
margin:auto;
display:block;
background:#ffb000;
color:white;
border:none;
padding:12px;
border-radius:10px;
font-size:16px;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:8px 0;
box-shadow:0 -2px 6px rgba(0,0,0,0.1);
}

.bottom-nav div{
text-align:center;
font-size:12px;
cursor:pointer;
}

.bottom-nav img{
height:24px;
}

.active{
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="Logo">
<div class="balance">₹00.0</div>
</div>

<!-- MAIN CONTENT -->
<div class="container">

<div class="title">Watch Video & Earn</div>

<!-- CUSTOM VIDEO LOOK -->
<div class="player-box">

<!-- RED PROGRESS BAR -->
<div class="progress-bar"></div>

<!-- THUMBNAIL IMAGE (APP LOOK) -->
<img src="Image/sale.jpg" alt="Video Thumbnail">

<!-- PLAY ICON -->
<img src="Image/play.png" class="play-btn">

<!-- HIDDEN REAL VIDEO -->
<video id="myVideo" style="display:none;">
<source src="Video/Ads.mp4" type="video/mp4">
</video>

</div>

<button class="btn-red" onclick="playVideo()">Continue Watching</button>
<button class="btn-yellow">Complete in: 25 seconds</button>

</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">

<div onclick="window.location.href='index.html'">
<img src="Image/Home.png">
<p>Home</p>
</div>

<div class="" onclick="window.location.href='tasks.html'">
<img src="Image/Task.png">
<p>Tasks</p>
</div>

<div onclick="window.location.href='wallet.html'">
<img src="Image/Wallet.png">
<p>Wallet</p>
</div>

<div onclick="window.location.href='account.html'">
<img src="Image/Name.png">
<p>Account</p>
</div>

</div>

<script>
function playVideo(){
document.querySelector(".player-box img").style.display="none";
document.getElementById("myVideo").style.display="block";
document.getElementById("myVideo").play();
}
</script>

</body>
</html>
