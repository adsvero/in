<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video & Earn</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f2f2f2;
}

/* HEADER */
.header{
background:linear-gradient(90deg,#ff3b3b,#ff6b6b);
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 15px;
}

.header img{
height:28px;
}

.balance{
background:white;
color:#ff3b3b;
padding:6px 12px;
border-radius:20px;
font-weight:bold;
}

/* CONTENT */
.container{
padding:20px;
padding-bottom:90px;
}

h2{
margin-top:10px;
}

/* VIDEO CARD */
.video-box{
position:relative;
border-radius:15px;
overflow:hidden;
background:black;
}

.video-box video{
width:100%;
border-radius:15px;
}

/* BUTTONS */
.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
margin-top:15px;
}

.red{
background:#ff3b3b;
color:white;
}

.yellow{
background:#f5a300;
color:white;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:8px 0;
border-top:1px solid #ddd;
}

.nav-item{
text-align:center;
font-size:12px;
color:#888;
text-decoration:none;
}

.nav-item img{
width:24px;
display:block;
margin:auto;
margin-bottom:4px;
}

.active{
color:#ff3b3b;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<img src="Image/logo.png">
<div class="balance">₹00.0</div>
</div>

<div class="container">

<h2>Watch Video & Earn</h2>

<div class="video-box">
<video id="adVideo" controls poster="Image/sale.jpg">
<source src="Video/Ads.mp4" type="video/mp4">
</video>
</div>

<button class="btn red">Continue Watching</button>
<button class="btn yellow">Complete in: 25 seconds</button>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<a href="index.html" class="nav-item">
<img src="Image/Home.png">
Home
</a>

<a href="tasks.html" class="nav-item active">
<img src="Image/Task.png">
Tasks
</a>

<a href="wallet.html" class="nav-item">
<img src="Image/Wallet.png">
Wallet
</a>

<a href="account.html" class="nav-item">
<img src="Image/Name.png">
Account
</a>
</div>

</body>
</html>
