<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My App</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#f2f2f2;
}

/* HEADER WITH LOGO */
.header{
    background:white;
    padding:10px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #ddd;
}

.header img{
    height:40px;
}

/* BALANCE BOX */
.balance{
    background:red;
    color:white;
    padding:6px 10px;
    border-radius:6px;
    font-size:14px;
}

/* MAIN CONTAINER */
.container{
    padding:15px;
    padding-bottom:80px; /* bottom menu ke liye space */
}

/* VIDEO BOX */
.video-box{
    background:black;
    padding:5px;
    border-radius:10px;
}

video{
    width:100%;
    border-radius:10px;
}

/* PROGRESS BAR */
.progress-container{
    width:100%;
    background:#ddd;
    height:6px;
    border-radius:5px;
    margin-top:8px;
}

.progress-bar{
    width:0%;
    height:6px;
    background:red;
    border-radius:5px;
}

/* BUTTONS */
.btn-red{
    width:100%;
    padding:12px;
    background:red;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    margin-top:10px;
}

.btn-yellow{
    width:100%;
    padding:12px;
    background:orange;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    margin-top:8px;
}

/* BOTTOM NAVIGATION */
.bottom{
    position:fixed;
    bottom:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:8px 0;
    border-top:1px solid #ddd;
}

.bottom div{
    text-align:center;
    font-size:12px;
    color:#666;
}

.bottom img{
    width:22px;
    display:block;
    margin:auto;
}
</style>
</head>

<body>

<!-- TOP HEADER WITH YOUR LOGO -->
<div class="header">
  <img src="logo.png" alt="Your Logo">
  <div class="balance">₹00.0</div>
</div>

<div class="container">

<h3>Watch Video & Earn</h3>

<div class="video-box">
<video id="myVideo" muted>
  <source src="ads.mp4" type="video/mp4">
</video>

<div class="progress-container">
  <div id="bar" class="progress-bar"></div>
</div>
</div>

<button class="btn-red" onclick="playVideo()">Continue Watching</button>

<button class="btn-yellow" id="timerBtn">Complete in: 25 seconds</button>

</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom">
  <div>
    <img src="home.png">
    Home
  </div>

  <div>
    <img src="task.png">
    Tasks
  </div>

  <div>
    <img src="wallet.png">
    Wallet
  </div>

  <div>
    <img src="Name.png">
    Account
  </div>
</div>

<script>
let video = document.getElementById("myVideo");
let bar = document.getElementById("bar");
let timerBtn = document.getElementById("timerBtn");
let timeLeft = 25;

function playVideo(){
   video.play();

   let interval = setInterval(function(){

      let percent = (video.currentTime / 25) * 100;
      bar.style.width = percent + "%";

      timerBtn.innerText = "Complete in: " + timeLeft + " seconds";
      timeLeft--;

      if(timeLeft < 0){
         clearInterval(interval);
         timerBtn.innerText = "✔ Completed!";
      }

   },1000);
}
</script>

</body>
</html>
