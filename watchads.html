<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video & Earn</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f2f2f2;
}

/* Header */
.header{
    background: linear-gradient(90deg,#ff3b3b,#ff6b6b);
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
}

.balance{
    background:white;
    color:#ff3b3b;
    padding:8px 15px;
    border-radius:20px;
}

/* Content */
.container{
    padding:20px;
    margin-bottom:90px;
}

h2{
    margin-top:0;
}

/* Video Box */
.video-box{
    background:black;
    border-radius:15px;
    overflow:hidden;
}

video{
    width:100%;
    border-radius:15px;
}

/* Buttons */
.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    margin-top:15px;
}

.red-btn{
    background:#ff3b3b;
    color:white;
}

.yellow-btn{
    background:#f7a600;
    color:white;
}

/* Bottom Navigation */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:8px 0;
    border-top:1px solid #ddd;
}

.nav-item{
    text-align:center;
    font-size:12px;
    color:#999;
    font-weight:700;
}

.nav-item img{
    width:26px;
    display:block;
    margin:0 auto 4px;
}

.nav-item.active{
    color:#ff3b3b;
}
</style>
</head>

<body>

<div class="header">
    <div>ADSVERO</div>
    <div class="balance">₹00.0</div>
</div>

<div class="container">
    <h2>Watch Video & Earn</h2>

    <div class="video-box">
        <video controls poster="thumbnail.jpg">
            <source src="Ads.mp4" type="video/mp4">
        </video>
    </div>

    <button class="btn red-btn">Continue Watching</button>
    <button class="btn yellow-btn">Complete in: 25 seconds</button>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <div class="nav-item">
        <img src="home.png">
        Home
    </div>
    <div class="nav-item active">
        <img src="tasks.png">
        Tasks
    </div>
    <div class="nav-item">
        <img src="wallet.png">
        Wallet
    </div>
    <div class="nav-item">
        <img src="account.png">
        Account
    </div>
</div>

</body>
</html>
