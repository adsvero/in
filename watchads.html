<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch & Earn</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
}

/* HEADER */
.header{
    background:linear-gradient(to right,#ff3b3b,#ff6b6b);
    padding:15px;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.wallet{
    background:#fff;
    color:#ff3b3b;
    padding:8px 15px;
    border-radius:20px;
    font-weight:bold;
}

/* CONTENT */
.container{
    padding:20px;
    padding-bottom:100px;
}

h2{
    margin-bottom:15px;
}

.video-box{
    background:#000;
    border-radius:15px;
    overflow:hidden;
}

video{
    width:100%;
    border-radius:15px;
}

/* BUTTONS */
.btn-red{
    background:#ff3b3b;
    color:white;
    padding:15px;
    text-align:center;
    border-radius:12px;
    margin-top:20px;
    font-weight:bold;
}

.btn-yellow{
    background:#f5a300;
    color:white;
    padding:15px;
    text-align:center;
    border-radius:12px;
    margin-top:15px;
    font-weight:bold;
}

/* BOTTOM NAVIGATION */
.bottom-nav{
    position:fixed;
    bottom:0;
    width:100%;
    background:#fff;
    display:flex;
    justify-content:space-around;
    padding:10px 0;
    border-top:1px solid #ddd;
}

.nav-item{
    text-align:center;
    font-size:12px;
    color:#999;
}

.nav-item.active{
    color:#ff3b3b;
    font-weight:bold;
}

.nav-item a{
    text-decoration:none;
    color:inherit;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">ADSVERO</div>
    <div class="wallet">₹00.0</div>
</div>

<!-- CONTENT -->
<div class="container">

    <h2>Watch Video & Earn</h2>

    <div class="video-box">
        <video controls>
            <source src="Ads.mp4" type="video/mp4">
        </video>
    </div>

    <div class="btn-red">Continue Watching</div>
    <div class="btn-yellow">Complete in: 25 seconds</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

    <div class="nav-item">
        <a href="index.html">Home</a>
    </div>

    <div class="nav-item active">
        <a href="task.html">Tasks</a>
    </div>

    <div class="nav-item">
        <a href="wallet.html">Wallet</a>
    </div>

    <div class="nav-item">
        <a href="Name.html">Account</a>
    </div>

</div>

</body>
</html>
