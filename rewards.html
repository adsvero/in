<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewards</title>

<style>
html, body{
margin:0;
font-family: Arial, sans-serif;
background:#f3f3f3;
width:100%;
height:100%;
}

/* ===== TOP BAR ===== */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:12px 14px;
color:white;
position:fixed;
top:0;
width:100%;
z-index:999;
box-sizing:border-box;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* ===== BANNER AREA ===== */
.page-bg{
margin-top:56px;
width:100%;
height:auto;
background:url("Image/Rewardbanner.png");
background-size:cover;
background-position:center top;
background-repeat:no-repeat;
padding-bottom:80px;
}

/* ===== ONLY ONE CARD (SMALLER) ===== */
.card{
width:72%;          /* छोटा कर दिया */
max-width:380px;    /* बहुत बड़ा नहीं जाएगा */
margin:10px auto;
background:white;
border-radius:14px;
padding:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

/* row layout */
.row{
display:flex;
align-items:center;
justify-content:space-between;
}

/* input box छोटा */
.input-box{
width:60%;
padding:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
}

/* button */
.btn{
background:#ffb000;
color:black;
border:none;
padding:10px 12px;
border-radius:8px;
font-size:14px;
font-weight:bold;
}

/* ===== BOTTOM NAVIGATION ===== */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:8px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}

.bottom-nav div{
text-align:center;
font-size:12px;
}

.bottom-nav img{
height:24px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- BANNER -->
<div class="page-bg">

<!-- ONLY ONE CARD (COPY CODE) -->
<div class="card">
<div class="row">
<input type="text" class="input-box" id="inviteCode" value="XYZ1234">
<button class="btn" onclick="copyCode()">Copy Code</button>
</div>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

<div onclick="window.location.href='index.html'">
<img src="Image/Home.png">
<p>Home</p>
</div>

<div onclick="window.location.href='task.html'">
<img src="Image/Tasks.png">
<p>Tasks</p>
</div>

<div onclick="window.location.href='wallet.html'">
<img src="Image/Wallet.png">
<p>Wallet</p>
</div>

<div onclick="window.location.href='account.html'">
<img src="Image/Name.png">
<p>Account</p>
</div>

</div>

<script>
function copyCode(){
var copyText = document.getElementById("inviteCode");
copyText.select();
document.execCommand("copy");
alert("Invite Code Copied!");
}
</script>

</body>
</html>
