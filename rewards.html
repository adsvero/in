<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Friends - ADSVERO</title>

<style>
body{
margin:0;
font-family: Arial, sans-serif;
background:#f2f2f2;
}

/* Top Header */
.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:10px;
background:#ff4b5c;
color:white;
}

.header img{
height:35px;
}

/* Wallet */
.wallet{
background:rgba(255,255,255,0.3);
padding:6px 10px;
border-radius:20px;
}

/* Main Container */
.container{
padding:10px;
}

/* Banner */
.banner{
width:100%;
border-radius:15px;
}

/* Card */
.card{
background:white;
border-radius:15px;
padding:15px;
margin-top:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* Copy box */
.copy-box{
display:flex;
justify-content:space-between;
align-items:center;
border:1px dashed #ffb703;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.copy-btn{
background:#ffb703;
border:none;
padding:8px 12px;
border-radius:8px;
font-weight:bold;
}

/* Share Link */
.share-row{
display:flex;
margin-top:10px;
}

.share-row input{
flex:1;
padding:8px;
border-radius:8px;
border:1px solid #ddd;
}

.share-btn{
background:#ffb703;
border:none;
padding:8px 12px;
margin-left:8px;
border-radius:8px;
font-weight:bold;
}

/* Social Icons */
.social-box{
display:flex;
justify-content:space-around;
background:white;
padding:15px;
border-radius:15px;
margin-top:10px;
}

.social-box img{
width:50px;
}

/* Bottom Navbar */
.navbar{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:10px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}

.navbar div{
text-align:center;
font-size:12px;
}

.active{
color:red;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<img src="logo.png" alt="ADSVERO Logo">
<div class="wallet">₹ 00.0</div>
</div>

<div class="container">

<!-- BANNER IMAGE -->
<img src="invitebannar.png" class="banner">

<!-- INVITE CARD -->
<div class="card">
<h2>Invite Friends</h2>
<p style="color:red;">Refer & Earn Rewards!</p>
<h3>Earn ₹100</h3>
<p>For each friend that joins!</p>

<div class="copy-box">
<b id="refCode">XYZ1234</b>
<button class="copy-btn" onclick="copyCode()">Copy Code</button>
</div>
</div>

<!-- SHARE LINK -->
<div class="share-row">
<input type="text" id="shareLink" value="https://adsvero.github.io/XYZ1234">
<button class="share-btn" onclick="copyLink()">Share</button>
</div>

<!-- SOCIAL SHARE -->
<div class="social-box">
<div>
<img src="whatsapp.png">
<p>WhatsApp</p>
</div>

<div>
<img src="facebook.png">
<p>Facebook</p>
</div>

<div>
<img src="sms.png">
<p>SMS</p>
</div>
</div>

</div>

<!-- BOTTOM NAVBAR -->
<div class="navbar">
<div>Home</div>
<div>Tasks</div>
<div>Wallet</div>
<div class="active">Rewards</div>
</div>

<script>
function copyCode(){
navigator.clipboard.writeText(document.getElementById("refCode").innerText);
alert("Referral Code Copied!");
}

function copyLink(){
navigator.clipboard.writeText(document.getElementById("shareLink").value);
alert("Invite Link Copied!");
}
</script>

</body>
</html>
