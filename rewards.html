<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Page</title>

<style>
html, body{
margin:0;
font-family: Arial, sans-serif;
background:#f3f3f3;
width:100%;
height:100%;
}

/* ===== TOP BAR ===== */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:12px 14px;
color:white;
position:fixed;
top:0;
width:100%;
z-index:999;
box-sizing:border-box;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* ===== MAIN CONTAINER (SCROLLABLE) ===== */
.main-wrapper{
margin-top:56px;          /* top bar height */
padding-bottom:70px;      /* bottom nav space */
min-height:100vh;
overflow-y:auto;          /* page scrollable */
}

/* ===== BANNER (NO ZOOM) ===== */
.banner{
width:100%;
}

.banner img{
width:100%;
display:block;
object-fit:contain;       /* zoom problem fix */
}

/* ===== CARDS OVER BANNER ===== */
.cards-area{
margin-top:-40px;         /* cards upar set on banner */
position:relative;
z-index:10;
display:flex;
flex-direction:column;
align-items:center;
}

/* ===== CARD STYLE ===== */
.card{
width:90%;
max-width:420px;
margin-bottom:12px;
background:white;
border-radius:14px;
padding:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
text-align:center;
}

/* LINK INPUT */
.link-box{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
}

/* BUTTON */
.btn{
margin-top:10px;
background:#ffb000;
color:black;
border:none;
padding:12px;
width:100%;
border-radius:8px;
font-size:16px;
font-weight:bold;
}

/* SOCIAL ICONS */
.share-box{
margin-top:10px;
display:flex;
justify-content:space-around;
align-items:center;
}

.share-box img{
width:55px;
}

/* ===== BOTTOM NAVIGATION ===== */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:8px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
z-index:999;
}

.bottom-nav div{
text-align:center;
font-size:12px;
cursor:pointer;
}

.bottom-nav img{
height:24px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<div class="main-wrapper">

<!-- BANNER -->
<div class="banner">
<img src="Image/Rewardbanner.png" alt="Invite Banner">
</div>

<!-- CARDS AREA -->
<div class="cards-area">

<!-- LINK CARD -->
<div class="card">
<h3>Share your invite link</h3>

<input type="text" class="link-box" id="refLink"
value="https://adsvero.github.io/XYZ1234">

<button class="btn" onclick="copyLink()">Copy & Share Link</button>
</div>

<!-- SOCIAL CARD -->
<div class="card">
<h4>Invite via your favorite apps</h4>

<div class="share-box">

<a href="https://wa.me/?text=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<a href="https://www.facebook.com/sharer/sharer.php?u=https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
</a>

<a href="sms:?body=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
</a>

</div>
</div>

</div>
</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">

<div onclick="window.location.href='index.html'">
<img src="Image/Home.png">
<p>Home</p>
</div>

<div onclick="window.location.href='tasks.html'">
<img src="Image/Tasks.png">
<p>Tasks</p>
</div>

<div onclick="window.location.href='wallet.html'">
<img src="Image/Wallet.png">
<p>Wallet</p>
</div>

<div onclick="window.location.href='invite.html'">
<img src="Image/Rewards.png">
<p>Rewards</p>
</div>

</div>

<script>
function copyLink(){
var copyText = document.getElementById("refLink");
copyText.select();
document.execCommand("copy");
alert("Link copied!");
}
</script>

</body>
</html>
