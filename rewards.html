<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewards | ADSVERO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f2f2f2;
}

/* Mobile Container */
#page{
max-width:430px;
margin:0 auto;
background:white;
min-height:100vh;
padding-bottom:80px;
}

/* HEADER SAME AS YOUR SITE */
.header{
background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
color:white;
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
}

.balance{
background:rgba(255,255,255,.25);
padding:6px 12px;
border-radius:20px;
}

/* ===== YOUR BANNER FIX ===== */
.banner{
padding:10px 12px;
}

.banner img{
width:100%;
border-radius:16px;
box-shadow:0 4px 14px rgba(0,0,0,.15);
display:block;
}

/* INVITE CARD */
.card{
background:white;
margin:12px;
padding:16px;
border-radius:18px;
box-shadow:0 6px 18px rgba(0,0,0,.12);
}

/* REFERRAL CODE BOX */
.code-box{
display:flex;
justify-content:space-between;
align-items:center;
border:2px dashed #f2a60c;
padding:12px;
border-radius:14px;
margin-top:10px;
background:#fff8e6;
}

.copy-btn{
background:#f2a60c;
color:white;
border:none;
padding:10px 16px;
border-radius:12px;
font-weight:bold;
}

/* SHARE LINK */
.share-row{
display:flex;
gap:8px;
margin:12px;
}

.share-input{
flex:1;
padding:12px;
border-radius:12px;
border:1px solid #ddd;
}

.share-btn{
background:#f2a60c;
color:white;
border:none;
padding:10px 14px;
border-radius:12px;
font-weight:bold;
}

/* INVITE TARGET LIST */
.invite-list{
margin:12px;
}

.invite-item{
background:white;
padding:14px;
border-radius:16px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

/* GOLD BUTTON STYLE */
.invite-now{
background:linear-gradient(90deg,#f2a60c,#f5b642);
color:white;
border:none;
padding:8px 14px;
border-radius:12px;
font-weight:bold;
}

/* BOTTOM NAV - SAME AS YOUR SITE */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
max-width:430px;
display:flex;
justify-content:space-around;
background:white;
padding:10px 0;
border-top:1px solid #ddd;
}

.nav-item{
text-align:center;
font-size:12px;
}

.nav-item img{
width:24px;
display:block;
margin:0 auto 4px;
}
</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="header">
<div>ADSVERO</div>
<div class="balance">₹ <span id="bal">00.0</span></div>
</div>

<!-- YOUR BANNER (FIXED NAME) -->
<div class="banner">
<img src="invitebannar.png">
</div>

<!-- INVITE CARD -->
<div class="card">
<h2>Invite Friends</h2>
<p style="color:#ff3b3b;">Refer & Earn Rewards!</p>

<h3 style="margin-top:8px;">Earn ₹100</h3>
<p>For each friend that joins!</p>

<div class="code-box">
<span id="refCode">XYZ1234</span>
<button class="copy-btn" onclick="copyCode()">Copy Code</button>
</div>
</div>

<!-- SHARE LINK -->
<div class="share-row">
<input class="share-input" id="shareLink"
value="https://adsvero.github.io/XYZ1234">
<button class="share-btn" onclick="shareNow()">Share</button>
</div>

<!-- INVITE TARGET LIST -->
<div class="invite-list">

<div class="invite-item">
<div><b>Invite 0/1 users</b><br>+58 INR</div>
<button class="invite-now" onclick="shareNow()">Invite Now</button>
</div>

<div class="invite-item">
<div><b>Invite 0/3 users</b><br>+128 INR</div>
<button class="invite-now" onclick="shareNow()">Invite Now</button>
</div>

<div class="invite-item">
<div><b>Invite 0/5 users</b><br>+138 INR</div>
<button class="invite-now" onclick="shareNow()">Invite Now</button>
</div>

<div class="invite-item">
<div><b>Invite 0/10 users</b><br>+348 INR</div>
<button class="invite-now" onclick="shareNow()">Invite Now</button>
</div>

<div class="invite-item">
<div><b>Invite 0/20 users</b><br>+728 INR</div>
<button class="invite-now" onclick="shareNow()">Invite Now</button>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<div class="nav-item">
<a href="index.html"><img src="Image/Home.png">Home</a>
</div>

<div class="nav-item">
<a href="tasks.html"><img src="Image/Task.png">Tasks</a>
</div>

<div class="nav-item">
<a href="wallet.html"><img src="Image/Wallet.png">Wallet</a>
</div>

<div class="nav-item">
<a href="account.html"><img src="Image/Name.png">Account</a>
</div>
</div>

</div>

<script>
function copyCode(){
navigator.clipboard.writeText("XYZ1234");
alert("Referral Code Copied ✅");
}

function shareNow(){
let link = document.getElementById("shareLink").value;
navigator.clipboard.writeText(link);
alert("Invite Link Copied ✅ Share anywhere!");
}
</script>

</body>
</html>
