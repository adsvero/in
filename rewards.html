<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Friends</title>

<style>
body{
margin:0;
font-family: Arial, sans-serif;
background:#f3f3f3;
}

/* -------- TOP BAR -------- */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:10px 12px;
color:white;
position:fixed;
top:0;
width:100%;
z-index:999;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* -------- PAGE BODY -------- */
.page{
margin-top:60px; /* space for top bar */
margin-bottom:70px; /* space for bottom nav */
}

/* -------- BANNER -------- */
.banner img{
width:100%;
display:block;
}

/* -------- CARD STYLE -------- */
.card{
background:white;
margin:10px;
padding:12px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* SHARE INPUT ROW */
.share-row{
display:flex;
align-items:center;
gap:8px;
}

.share-row input{
flex:1;
padding:8px;
border:1px solid #ddd;
border-radius:8px;
}

/* SHARE BUTTON */
.share-btn{
background:#f5a623;
color:black;
border:none;
padding:8px 12px;
border-radius:8px;
font-weight:bold;
display:flex;
align-items:center;
gap:5px;
}

/* -------- APP ICON ROW -------- */
.app-row{
display:flex;
justify-content:space-around;
align-items:center;
margin-top:10px;
}

.app-box{
text-align:center;
font-size:12px;
}

.app-box img{
width:55px;
}

/* -------- BOTTOM NAV -------- */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:8px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}

.bottom-nav a{
text-decoration:none;
color:gray;
}

.bottom-nav .active{
color:red;
}

.bottom-nav div{
text-align:center;
font-size:12px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<div class="page">

<!-- BANNER -->
<div class="banner">
<img src="Image/Rewardbanner.png" alt="Reward Banner">
</div>

<!-- SHARE LINK CARD -->
<div class="card">
<b>Share your invite link</b><br>
<small>Invite friends through your favorite apps</small>

<div class="share-row" style="margin-top:8px;">
<input type="text" id="refLink" value="https://adsvero.github.io/XYZ1234">

<button class="share-btn" onclick="copyLink()">
📤 Share
</button>
</div>
</div>

<!-- APPS CARD -->
<div class="card">
<b>Invite friends through your favorite apps</b>

<div class="app-row">

<div class="app-box">
<a href="https://wa.me/?text=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
<p>Invite via<br>WhatsApp</p>
</a>
</div>

<div class="app-box">
<a href="https://www.facebook.com/sharer/sharer.php?u=https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
<p>Invite via<br>Facebook</p>
</a>
</div>

<div class="app-box">
<a href="sms:?body=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
<p>Invite via<br>SMS</p>
</a>
</div>

</div>
</div>

</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">

<a href="index.html">
<div>
🏠<br>Home
</div>
</a>

<a href="tasks.html">
<div>
✅<br>Tasks
</div>
</a>

<a href="wallet.html">
<div>
💼<br>Wallet
</div>
</a>

<a href="account.html">
<div class="active">
👤<br>Account
</div>
</a>

</div>

<script>
function copyLink(){
var link = document.getElementById("refLink");
link.select();
navigator.clipboard.writeText(link.value);
alert("Link copied!");
}
</script>

</body>
</html>
