<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Page</title>

<style>
body{
margin:0;
font-family: Arial, sans-serif;
background:#f3f3f3;
}

/* ===== TOP BAR FIX ===== */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:12px 14px;   /* <-- बढ़ाया गया */
color:white;
position:fixed;
top:0;
width:100%;
z-index:999;
box-sizing:border-box;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* ===== BACKGROUND FIX ===== */
.page-bg{
margin-top:56px;   /* <-- top bar height के बराबर */
width:100%;
min-height:100vh;
background:url("Image/Rewardbanner.png");
background-size:contain;   /* <-- ZOOM FIX */
background-position:top center;
background-repeat:no-repeat;
padding-top:280px; /* banner ke niche content lane ke liye */
}

/* ===== CARD ===== */
.card{
margin:15px;
background:white;
border-radius:12px;
padding:15px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
text-align:center;
}

/* LINK INPUT */
.link-box{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
}

/* BUTTON */
.btn{
margin-top:10px;
background:#ffb000;
color:black;
border:none;
padding:10px;
width:100%;
border-radius:8px;
font-size:16px;
font-weight:bold;
}

/* SOCIAL ICONS */
.share-box{
margin-top:15px;
display:flex;
justify-content:space-around;
align-items:center;
}

.share-box img{
width:55px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- BACKGROUND -->
<div class="page-bg">

<!-- CARD WITH LINK -->
<div class="card">
<h3>Invite Friends</h3>

<input type="text" class="link-box" id="refLink"
value="https://adsvero.github.io/XYZ1234">

<button class="btn" onclick="copyLink()">Copy & Share Link</button>
</div>

<!-- SOCIAL BUTTONS -->
<div class="card">
<h4>Invite via your favorite apps</h4>

<div class="share-box">

<a href="https://wa.me/?text=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<a href="https://www.facebook.com/sharer/sharer.php?u=https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
</a>

<a href="sms:?body=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
</a>

</div>
</div>

</div>

<script>
function copyLink(){
var copyText = document.getElementById("refLink");
copyText.select();
document.execCommand("copy");
alert("Link copied!");
}
</script>

</body>
</html>
