<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Page</title>

<style>
html, body{
margin:0;
font-family: Arial, sans-serif;
background:#f3f3f3;
width:100%;
height:100%;
overflow-y:auto;
}

/* ===== TOP BAR ===== */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:12px 14px;
color:white;
position:fixed;
top:0;
width:100%;
z-index:999;
box-sizing:border-box;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* ===== BANNER ===== */
.banner{
margin-top:56px;
width:100%;
position:relative;
}

.banner img{
width:100%;
display:block;
}

/* ===== FLOATING CARDS ON BANNER ===== */

/* Upper box (Invite Code Card) */
.code-card{
position:absolute;
top:45%;
left:50%;
transform:translateX(-50%);
width:85%;
background:white;
border-radius:12px;
padding:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
text-align:center;
}

/* Lower box (Invite Links Card) */
.link-card{
position:absolute;
top:65%;
left:50%;
transform:translateX(-50%);
width:85%;
background:white;
border-radius:12px;
padding:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
text-align:center;
}

/* input */
.link-box{
width:100%;
padding:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
}

/* button */
.btn{
margin-top:8px;
background:#ffb000;
color:black;
border:none;
padding:10px;
width:100%;
border-radius:8px;
font-size:15px;
font-weight:bold;
}

/* social row */
.share-row{
display:flex;
justify-content:space-around;
margin-top:8px;
}

.share-row img{
width:45px;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:8px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
z-index:999;
}

.bottom-nav div{
text-align:center;
font-size:12px;
cursor:pointer;
}

.bottom-nav img{
height:24px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- BANNER WITH TWO WHITE BOXES -->
<div class="banner">
<img src="Image/Rewardbanner.png" alt="Reward Banner">

<!-- UPPER BOX → INVITE CODE -->
<div class="code-card">
<h4>Your Invite Code</h4>
<input type="text" class="link-box" value="XYZ1234" readonly>
<button class="btn" onclick="copyCode()">Copy Code</button>
</div>

<!-- LOWER BOX → INVITE LINKS -->
<div class="link-card">
<h4>Share your invite link</h4>
<input type="text" class="link-box" id="refLink"
value="https://adsvero.github.io/XYZ1234">

<button class="btn" onclick="copyLink()">Copy & Share Link</button>

<div class="share-row">
<a href="https://wa.me/?text=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<a href="https://www.facebook.com/sharer/sharer.php?u=https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
</a>

<a href="sms:?body=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
</a>
</div>
</div>

</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">

<div onclick="window.location.href='index.html'">
<img src="Image/Home.png">
<p>Home</p>
</div>

<div onclick="window.location.href='tasks.html'">
<img src="Image/Tasks.png">
<p>Tasks</p>
</div>

<div onclick="window.location.href='wallet.html'">
<img src="Image/Wallet.png">
<p>Wallet</p>
</div>

<div onclick="window.location.href='invite.html'">
<img src="Image/Rewards.png">
<p>Rewards</p>
</div>

</div>

<script>
function copyCode(){
navigator.clipboard.writeText("XYZ1234");
alert("Invite Code Copied!");
}

function copyLink(){
var copyText = document.getElementById("refLink");
copyText.select();
document.execCommand("copy");
alert("Invite Link Copied!");
}
</script>

</body>
</html>
