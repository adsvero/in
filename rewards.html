<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Page</title>

<style>
body{
margin:0;
font-family: Arial, sans-serif;
background:url("Image/Rewardbanner.png") no-repeat center top;
background-size:cover;
min-height:100vh;
padding-bottom:80px; /* bottom nav ke liye space */
}

/* TOP BAR */
.top-bar{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:10px 12px;
color:white;
z-index:1000;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* BANNER */
.invite-banner{
margin-top:55px; /* top bar ke niche lane ke liye */
width:100%;
}

.invite-banner img{
width:100%;
display:block;
}

/* LINK CARD */
.card{
margin:15px;
background:white;
border-radius:12px;
padding:15px;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.card h3{
margin:0 0 10px 0;
text-align:center;
}

.link-box{
display:flex;
align-items:center;
gap:8px;
}

.link-box input{
width:70%;
padding:8px;
border:1px solid #ccc;
border-radius:8px;
}

.share-btn{
background:#ffb000;
color:black;
border:none;
padding:10px 12px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

/* APPS CARD */
.app-card{
margin:15px;
background:white;
border-radius:12px;
padding:15px;
text-align:center;
}

.app-icons{
display:flex;
justify-content:space-around;
margin-top:10px;
}

.app-icons div{
text-align:center;
}

.app-icons img{
width:55px;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:8px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
z-index:1000;
}

.bottom-nav a{
text-decoration:none;
color:black;
text-align:center;
font-size:12px;
}

.bottom-nav img{
width:22px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- BANNER -->
<div class="invite-banner">
<img src="Image/invitebannar.png" alt="Invite Banner">
</div>

<!-- SHARE LINK CARD -->
<div class="card">
<h3>Share your invite link</h3>
<p>Invite friends through your favorite apps</p>

<div class="link-box">
<input type="text" value="https://adsvero.github.io/XYZ1234" readonly id="refLink">
<button class="share-btn" onclick="copyLink()">Share</button>
</div>
</div>

<!-- APPS CARD -->
<div class="app-card">
<h3>Invite via your favorite apps</h3>

<div class="app-icons">

<div>
<a href="https://wa.me/?text=Join ADSVERO using my link: https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
<p>WhatsApp</p>
</a>
</div>

<div>
<a href="https://www.facebook.com/sharer/sharer.php?u=https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
<p>Facebook</p>
</a>
</div>

<div>
<a href="sms:?body=Join ADSVERO using my link: https://adsvero.github.io/XYZ1234">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
<p>SMS</p>
</a>
</div>

</div>
</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">

<a href="index.html">
<img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png">
<p>Home</p>
</a>

<a href="tasks.html">
<img src="https://cdn-icons-png.flaticon.com/512/190/190411.png">
<p>Tasks</p>
</a>

<a href="wallet.html">
<img src="https://cdn-icons-png.flaticon.com/512/3144/3144456.png">
<p>Wallet</p>
</a>

<a href="rewards.html">
<img src="https://cdn-icons-png.flaticon.com/512/1040/1040230.png">
<p>Rewards</p>
</a>

</div>

<script>
function copyLink(){
var link = document.getElementById("refLink");
link.select();
document.execCommand("copy");
alert("Link copied!");
}
</script>

</body>
  </html>
