<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Page</title>

<style>
body{
margin:0;
font-family: Arial, sans-serif;
background:#f3f3f3;
}

/* TOP BAR */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:10px 12px;
color:white;
}

.top-bar img{
height:32px;
}

/* BALANCE */
.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* MAIN CARD */
.card{
background:white;
padding:0;
}

/* FULL BANNER */
.banner img{
width:100%;
display:block;
}

/* REFERRAL LINK BOX */
.link-box{
padding:15px;
text-align:center;
background:white;
border-top:1px solid #eee;
}

.link-input{
width:90%;
padding:10px;
border:1px solid #ccc;
border-radius:8px;
text-align:center;
}

/* SHARE BUTTON */
.share-btn{
margin-top:10px;
padding:10px 15px;
background:#ffb000;
border:none;
border-radius:8px;
font-size:16px;
}

/* SHARE APPS BLOCK */
.share-section{
margin-top:15px;
padding:15px;
background:#fff;
text-align:center;
}

.share-box{
display:flex;
justify-content:space-around;
align-items:center;
}

.share-box div{
text-align:center;
}

.share-box img{
width:60px;
}

/* BOTTOM SPACING (so nav not overlap) */
.bottom-space{
height:80px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- MAIN CONTENT -->
<div class="card">

<!-- FULL BANNER -->
<div class="banner">
<img src="Image/Rewardbanner.png" alt="Invite Banner">
</div>

<!-- REFERRAL LINK BOX (banner ke just niche) -->
<div class="link-box">
<input class="link-input" type="text" 
value="https://adsvero.github.io/XYZ1234" readonly>

<br><br>
<button class="share-btn" onclick="copyLink()">Copy & Share Link</button>
</div>

<!-- SHARE APPS (bilkul niche) -->
<div class="share-section">
<h3>Invite friends through your favorite apps</h3>

<div class="share-box">

<div>
<a href="https://wa.me/?text=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
<p>WhatsApp</p>
</a>
</div>

<div>
<a href="https://www.facebook.com/sharer/sharer.php?u=https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
<p>Facebook</p>
</a>
</div>

<div>
<a href="sms:?body=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
<p>SMS</p>
</a>
</div>

</div>
</div>

<div class="bottom-space"></div>

<script>
function copyLink(){
navigator.clipboard.writeText("https://adsvero.github.io/XYZ1234");
alert("Link Copied!");
}
</script>

</body>
</html>
