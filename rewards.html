<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Page</title>

<style>
body{
margin:0;
font-family: Arial, sans-serif;
}

/* TOP BAR */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:10px 12px;
color:white;
position:fixed;
top:0;
width:100%;
z-index:100;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* FULL SCREEN BACKGROUND */
.page-bg{
margin-top:60px;   /* top bar ke niche se start */
width:100%;
height:calc(100vh - 60px);
background:url("Image/Rewardbanner.png");
background-size:cover;      /* full cover */
background-position:center;
background-repeat:no-repeat;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- BACKGROUND AREA -->
<div class="page-bg"></div>

</body>
  </html>
