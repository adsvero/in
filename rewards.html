<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Page</title>

<style>
body{
margin:0;
font-family: Arial, sans-serif;
background:#f3f3f3;
}

/* TOP BAR */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:10px 12px;
color:white;
}

.top-bar img{
height:32px;
}

/* BALANCE */
.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* MAIN CARD */
.card{
background:white;
padding:0;
}

/* FULL WIDTH BANNER */
.banner img{
width:100%;
display:block;
}

/* INVITE LINK BOX */
.invite-link-box{
padding:15px;
background:white;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #ddd;
}

.invite-link-box input{
width:70%;
padding:8px;
border:1px solid #ddd;
border-radius:6px;
}

.invite-link-box button{
background:#ffb400;
border:none;
color:black;
padding:8px 12px;
border-radius:8px;
}

/* SHARE SECTION (BOTTOM) */
.share-section{
margin-top:15px;
padding:15px;
background:white;
text-align:center;
}

.share-box{
display:flex;
justify-content:space-around;
align-items:center;
margin-top:10px;
}

.share-box div{
text-align:center;
}

.share-box img{
width:55px;
}

/* BOTTOM NAV (dummy example) */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:8px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}

.bottom-nav div{
text-align:center;
font-size:12px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- MAIN CONTENT -->
<div class="card">

<!-- FULL WIDTH BANNER -->
<div class="banner">
<img src="Image/nvitebannar.png" alt="Invite Banner">
</div>

<!-- INVITE LINK JUST BELOW BANNER -->
<div class="invite-link-box">
<input type="text" value="https://adsvero.github.io/XYZ1234">
<button>Share</button>
</div>

<!-- SHARE APPS AT BOTTOM -->
<div class="share-section">
<h3>Invite friends through your favorite apps</h3>

<div class="share-box">

<div>
<a href="https://wa.me/?text=Join ADSVERO using my link: https://adsvero.github.io">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
<p>WhatsApp</p>
</a>
</div>

<div>
<a href="https://www.facebook.com/sharer/sharer.php?u=https://adsvero.github.io">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
<p>Facebook</p>
</a>
</div>

<div>
<a href="sms:?body=Join ADSVERO using my link: https://adsvero.github.io">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
<p>SMS</p>
</a>
</div>

</div>
</div>

</div>

</body>
  </html>
