<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Page</title>

<style>
html, body{
margin:0;
font-family: Arial, sans-serif;
background:#f3f3f3;
width:100%;
height:100%;
overflow-y:auto;
}

/* ===== TOP BAR ===== */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:12px 14px;
color:white;
position:fixed;
top:0;
width:100%;
z-index:999;
box-sizing:border-box;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* ===== BANNER ===== */
.banner{
margin-top:56px;
width:100%;
}

.banner img{
width:100%;
display:block;
}

/* ===== BOTTOM NAVIGATION ===== */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:8px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
z-index:999;
}

.bottom-nav div{
text-align:center;
font-size:12px;
cursor:pointer;
}

.bottom-nav img{
height:24px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- ONLY BANNER (NO CARDS, NO SOCIAL ICONS) -->
<div class="banner">
<img src="Image/Rewardbanner.png" alt="Reward Banner">
</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">

<div onclick="window.location.href='index.html'">
<img src="Image/Home.png">
<p>Home</p>
</div>

<div onclick="window.location.href='tasks.html'">
<img src="Image/Tasks.png">
<p>Tasks</p>
</div>

<div onclick="window.location.href='wallet.html'">
<img src="Image/Wallet.png">
<p>Wallet</p>
</div>

<div onclick="window.location.href='invite.html'">
<img src="Image/Rewards.png">
<p>Rewards</p>
</div>

</div>

</body>
</html>
