<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Friends</title>

<style>
body{
margin:0;
font-family: Arial, sans-serif;
background:white;
}

/* TOP BAR */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:10px 12px;
color:white;
position:fixed;
top:0;
width:100%;
z-index:999;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* MAIN CONTENT */
.main{
margin-top:60px; /* top bar space */
margin-bottom:70px; /* bottom nav space */
}

/* BACKGROUND BANNER */
.banner img{
width:100%;
display:block;
}

/* CARD STYLE */
.card{
background:white;
margin:15px;
padding:15px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* BUTTON */
.btn{
width:100%;
padding:12px;
background:#f5a623;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
color:black;
}

/* SHARE BOX */
.share-box{
display:flex;
justify-content:space-around;
align-items:center;
margin-top:10px;
}

.share-box img{
width:55px;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:8px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}

.bottom-nav a{
text-decoration:none;
color:black;
}

.bottom-nav div{
text-align:center;
font-size:12px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

<!-- BACKGROUND BANNER -->
<div class="banner">
<img src="Image/Rewardbanner.png" alt="Reward Banner">
</div>

<!-- INVITE LINK CARD -->
<div class="card">

<input type="text" value="https://adsvero.github.io/XYZ1234" style="width:100%; padding:8px;">

</div>

<div>
<a href="https://www.facebook.com/sharer/sharer.php?u=https://adsvero.github.io/XYZ1234">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
<p>Facebook</p>

</div>

<div>
<a href="sms:?body=Join ADSVERO: https://adsvero.github.io/XYZ1234">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
<p>SMS</p>

</div>

</div>
</div>

</div>

<!-- BOTTOM NAVIGATION (SAME AS OTHER PAGES) -->
<div class="bottom-nav">

</html>
