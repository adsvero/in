<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Page</title>

<style>
html, body{
margin:0;
font-family: Arial, sans-serif;
background:#f3f3f3;
width:100%;
height:100%;
overflow-y:auto;
}

/* ===== TOP BAR ===== */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(90deg,#ff4b4b,#ff7b7b);
padding:12px 14px;
color:white;
position:fixed;
top:0;
width:100%;
z-index:999;
box-sizing:border-box;
}

.top-bar img{
height:32px;
}

.balance{
background:white;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:14px;
}

/* ===== BANNER ===== */
.banner{
margin-top:56px;
width:100%;
}

.banner img{
width:100%;
display:block;
}

/* ===== FLOATING CARDS (EXACT LIKE YOUR IMAGE) ===== */
.floating-container{
position:relative;
top:-70px;   /* IMPORTANT: moves cards UP over banner */
}

/* Card style */
.card{
width:45%;              /* card ko chhota rakhega */
max-width:420px;
margin:-50px 45% 20px auto;   /* ← IMPORTANT: card ko right side le jata hai */
background:white;
border-radius:14px;
padding:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
text-align:center;
}

/* row layout */
.row{
display:flex;
align-items:center;
justify-content:space-between;
}

/* input boxes */
.input-box{
width:68%;
padding:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
}

/* buttons */
.small-btn{
background:#ffb000;
border:none;
padding:10px 14px;
border-radius:8px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:white;
padding:8px 0;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}

.bottom-nav div{
text-align:center;
font-size:12px;
cursor:pointer;
}

.bottom-nav img{
height:24px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<img src="Image/logo.png" alt="logo">
<div class="balance">₹ 00.0</div>
</div>

<!-- BANNER -->
<div class="banner">
<img src="Image/Rewardbanner.png" alt="Reward Banner">
</div>

<!-- FLOATING CARDS -->
<div class="floating-container">

<!-- INVITE CODE -->
<div class="card">
<div class="row">
<input type="text" class="input-box" id="inviteCode" value="XYZ1234" readonly>
<button class="small-btn" onclick="copyCode()">Copy Code</button>
</div>
</div>

<!-- INVITE LINK -->
<div class="card">
<div class="row">
<input type="text" class="input-box" id="refLink"
value="https://adsvero.github.io/XYZ1234">
<button class="small-btn" onclick="copyLink()">Share</button>
</div>
</div>
  
</div>

<br><br><br>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">

<div onclick="window.location.href='index.html'">
<img src="Image/Home.png">
<p>Home</p>
</div>

<div onclick="window.location.href='tasks.html'">
<img src="Image/Tasks.png">
<p>Tasks</p>
</div>

<div onclick="window.location.href='wallet.html'">
<img src="Image/Wallet.png">
<p>Wallet</p>
</div>

<div onclick="window.location.href='invite.html'">
<img src="Image/Rewards.png">
<p>Rewards</p>
</div>

</div>

<script>
function copyCode(){
navigator.clipboard.writeText("XYZ1234");
alert("Invite Code Copied!");
}

</script>

</body>
</html>
