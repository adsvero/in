<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rewards | ADSVERO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f2f2f2;
}

/* ====== PAGE CONTAINER ====== */
#page{
max-width:430px;
margin:auto;
background:white;
min-height:100vh;
}

/* ====== RED HEADER ====== */
.reward-header{
background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
color:white;
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
}

.balance-pill{
background:rgba(255,255,255,0.3);
padding:6px 12px;
border-radius:20px;
}

/* ====== BANNER ====== */
.banner{
width:100%;
}

.banner img{
width:100%;
display:block;
}

/* ====== MAIN CARD ====== */
.card{
background:white;
margin:10px;
padding:15px;
border-radius:18px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

/* ====== REFERRAL BOX ====== */
.ref-box{
border:2px dashed #ffb400;
border-radius:12px;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
}

.copy-btn{
background:#f2a600;
color:black;
border:none;
padding:8px 14px;
border-radius:10px;
font-weight:bold;
}

/* ====== SHARE BOX ====== */
.share-box{
display:flex;
gap:8px;
margin:10px;
}

.share-box input{
flex:1;
padding:10px;
border:1px solid #ddd;
border-radius:10px;
}

.share-btn{
background:#f2a600;
color:black;
border:none;
padding:10px 14px;
border-radius:10px;
font-weight:bold;
}

/* ====== INVITE LIST ====== */
.invite-card{
background:white;
margin:10px;
padding:12px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.invite-btn{
background:#f2a600;
border:none;
padding:8px 14px;
border-radius:12px;
font-weight:bold;
}

/* ====== BOTTOM NAV ====== */
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
}

.bottom-nav img{
width:26px;
display:block;
margin:auto;
}
</style>

<script>
function copyCode(){
navigator.clipboard.writeText("XYZ1234");
alert("Referral code copied ✅");
}

function shareLink(){
alert("Share feature coming soon!");
}

function inviteNow(){
alert("Invite feature coming soon!");
}
</script>

</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="reward-header">
<span>ADSVERO</span>
<span class="balance-pill">₹ 00.0</span>
</div>

<!-- BANNER -->
<div class="banner">
<img src="invitebannar.png" alt="Invite Banner">
</div>

<!-- INVITE CARD -->
<div class="card">
<h2>Invite Friends</h2>
<p style="color:red;">Refer & Earn Rewards!</p>
<h3>Earn ₹100</h3>
<p>For each friend that joins!</p>

<div class="ref-box">
<span>XYZ1234</span>
<button class="copy-btn" onclick="copyCode()">Copy Code</button>
</div>
</div>

<!-- SHARE LINK -->
<div class="share-box">
<input type="text" value="https://adsvero.github.io/XYZ1234">
<button class="share-btn" onclick="shareLink()">Share</button>
</div>

<!-- INVITE LIST -->
<div class="invite-card">
<div>Invite 0/1 users<br>+58 INR</div>
<button class="invite-btn" onclick="inviteNow()">Invite Now</button>
</div>

<div class="invite-card">
<div>Invite 0/3 users<br>+128 INR</div>
<button class="invite-btn" onclick="inviteNow()">Invite Now</button>
</div>

<div class="invite-card">
<div>Invite 0/5 users<br>+138 INR</div>
<button class="invite-btn" onclick="inviteNow()">Invite Now</button>
</div>

<div class="invite-card">
<div>Invite 0/10 users<br>+348 INR</div>
<button class="invite-btn" onclick="inviteNow()">Invite Now</button>
</div>

<div class="invite-card">
<div>Invite 0/20 users<br>+728 INR</div>
<button class="invite-btn" onclick="inviteNow()">Invite Now</button>
</div>

<div class="invite-card">
<div>Invite 0/50 users<br>+2238 INR</div>
<button class="invite-btn" onclick="inviteNow()">Invite Now</button>
</div>

<div class="invite-card">
<div>Invite 0/100 users<br>+3948 INR</div>
<button class="invite-btn" onclick="inviteNow()">Invite Now</button>
</div>

<br><br><br>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<a href="index.html"><img src="Image/Home.png"></a>
<a href="tasks.html"><img src="Image/Task.png"></a>
<a href="wallet.html"><img src="Image/Wallet.png"></a>
<a href="account.html"><img src="Image/Name.png"></a>
</div>

</div>

</body>
                       </html>
