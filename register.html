<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | ADSVERO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
  min-height:100vh;
  background:#f2f2f2;
  display:flex;
  justify-content:center;
  align-items:center;
  padding-bottom:90px;
}
body::before{
  content:"";
  position:fixed;
  top:0;left:0;
  width:100%;height:260px;
  background:url("Image/Background.png") no-repeat center top;
  background-size:cover;
  z-index:-1;
}
.logo{position:fixed;top:22px;left:20px;}
.logo img{height:45px;}

.card{
  width:90%;
  max-width:420px;
  background:#fff;
  border-radius:24px;
  padding:26px 18px;
  box-shadow:0 18px 40px rgba(0,0,0,.15);
}
.input-box{
  display:flex;
  align-items:center;
  background:#f5f5f5;
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
}
.input-box img{width:22px;margin-right:10px;opacity:.7;}
.input-box input{border:none;outline:none;background:transparent;width:100%;}
.btn{
  width:100%;
  border:none;
  border-radius:30px;
  padding:16px;
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
  color:#fff;
  font-size:18px;
  font-weight:700;
}
.login-text{text-align:center;margin-top:16px;font-size:14px;}
.login-text span{color:#ff3b3b;font-weight:700;cursor:pointer;}
</style>
</head>

<body>

<div class="logo"><img src="Image/logo.png"></div>

<div class="card">
  <h2 style="text-align:center">Register</h2>
  <p style="text-align:center;color:#777;margin-bottom:20px">Create your account</p>

  <div class="input-box">
    <img src="Image/Phone.png">
    <input type="text" id="regPhone" placeholder="Phone Number">
  </div>

  <div class="input-box">
    <img src="Image/Password.png">
    <input type="password" id="regPassword" placeholder="Password">
  </div>

  <button class="btn" id="registerBtn">Register</button>

  <div class="login-text">
    Already have an account?
    <span onclick="location.href='login.html'">Login</span>
  </div>
</div>

<script>
document.getElementById("registerBtn").onclick = function () {
  const phone = document.getElementById("regPhone").value.trim();
  const pass = document.getElementById("regPassword").value.trim();

  if(phone === "" || pass === ""){
    alert("Fill all fields");
    return;
  }

  localStorage.setItem("userPhone", phone);
  localStorage.setItem("userPassword", pass);
  localStorage.setItem("isLoggedIn", "false");

  alert("Registration Successful ✅");
  window.location.href = "login.html";
};
</script>

</body>
</html>
