<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History | </title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f2f2f2}

#page{
max-width:430px;
margin:auto;
background:white;
min-height:100vh;
padding-bottom:80px;
}

/* HEADER */
.header{
background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
padding:18px 0;
color:#fff;
border-bottom-left-radius:32px;
border-bottom-right-radius:32px;
}
.header-top{
display:flex;
justify-content:space-between;
align-items:center;
padding:0 16px;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.brand img{height:36px}
.wallet-badge{
background:rgba(255,255,255,.25);
padding:8px 12px;
border-radius:20px;
font-weight:700;
}

/* TITLE ROW */
.title-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px;
}
.title-row h2{font-size:22px}

/* FILTER */
.filter{
position:relative;
font-size:14px;
color:#555;
cursor:pointer;
}
.filter-menu{
display:none;
position:absolute;
right:0;
top:24px;
background:white;
border-radius:8px;
box-shadow:0 6px 16px rgba(0,0,0,.15);
overflow:hidden;
}
.filter-menu div{
padding:10px 14px;
cursor:pointer;
}
.filter-menu div:hover{background:#f2f2f2}

/* CARD */
.card{
background:#f7f7f7;
margin:0 16px;
border-radius:16px;
overflow:hidden;
}
.tx{
display:flex;
justify-content:space-between;
padding:14px 12px;
border-bottom:1px solid #e5e5e5;
}
.tx:last-child{border:none}
.tx-title{font-size:15px}
.tx-date{font-size:12px;color:#777}
.tx-amt{font-weight:bold;font-size:16px}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:#fff;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
}
.nav-item{text-align:center;font-size:12px;color:#999;font-weight:700}
.nav-item img{width:26px;display:block;margin:auto}
.nav-item.active{color:#ff3b3b}
</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="header">
<div class="header-top">
<div class="brand">
<img src="Image/logo.png">
<span></span>
</div>
<div class="wallet-badge">₹ <span id="walletAmt">0.00</span></div>
</div>
</div>

<!-- TITLE -->
<div class="title-row">
<h2>Transaction History</h2>

<div class="filter" onclick="toggleFilter()">
<span id="filterText">All types ▾</span>

<div class="filter-menu" id="filterMenu">
<div onclick="setFilter('all')">All</div>
<div onclick="setFilter('deposit')">Deposit</div>
<div onclick="setFilter('withdraw')">Withdraw</div>
</div>

</div>
</div>

<!-- LIST -->
<div class="card" id="txList"></div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<div class="nav-item">
<a href="index.html" style="text-decoration:none;color:inherit">
<img src="Image/Home.png">Home
</a>
</div>

<div class="nav-item">
<a href="tasks.html" style="text-decoration:none;color:inherit">
<img src="Image/Task.png">Tasks
</a>
</div>

<div class="nav-item">
<a href="wallet.html" style="text-decoration:none;color:inherit">
<img src="Image/Wallet.png">Wallet
</a>
</div>

<div class="nav-item">
<a href="account.html" style="text-decoration:none;color:inherit">
<img src="Image/Name.png">Account
</a>
</div>
</div>

<script>

let currentFilter="all";

/* WALLET */
function loadWallet(){
let bal=parseFloat(localStorage.getItem("walletBalance")||0);
document.getElementById("walletAmt").innerText=bal.toFixed(2);
}

/* FILTER */
function toggleFilter(){
let m=document.getElementById("filterMenu");
m.style.display=m.style.display==="block"?"none":"block";
}

function setFilter(type){
currentFilter=type;

document.getElementById("filterText").innerText=
type==="all"?"All types ▾":
type==="deposit"?"Deposit ▾":"Withdraw ▾";

document.getElementById("filterMenu").style.display="none";
loadHistory();
}

/* HISTORY LOAD */
function loadHistory(){
let history=JSON.parse(localStorage.getItem("txHistory")||"[]");
let list=document.getElementById("txList");
list.innerHTML="";

history.forEach(tx=>{

if(currentFilter!=="all" && tx.type!==currentFilter) return;

let color=tx.type==="deposit"?"#16a34a":"#dc2626";
let sign=tx.type==="deposit"?"+":"-";

list.innerHTML+=`
<div class="tx">
<div>
<div class="tx-amt" style="color:${color}">
${sign} ₹${tx.amount}
</div>
<div class="tx-title">${tx.note}</div>
<div class="tx-date">${tx.date}</div>
</div>
<div style="color:#aaa">›</div>
</div>`;
});
}

/* INIT DEMO DATA */
if(!localStorage.getItem("txHistory")){
let demo=[
{type:"deposit",amount:100,note:"Referral Bonus",date:"Apr 23, 2024"},
{type:"withdraw",amount:50,note:"Wallet Withdrawal",date:"Apr 21, 2024"},
{type:"withdraw",amount:100,note:"Wallet Withdrawal",date:"Apr 18, 2024"},
{type:"deposit",amount:200,note:"Tasks Completed",date:"Apr 16, 2024"}
];
localStorage.setItem("txHistory",JSON.stringify(demo));
}

loadWallet();
loadHistory();

</script>

</body>
</html>
