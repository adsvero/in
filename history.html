<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{background:#f4f4f4}

/* ===== HEADER ===== */
.topbar{
background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
padding:18px 16px 26px;
border-bottom-left-radius:28px;
border-bottom-right-radius:28px;
display:flex;
justify-content:space-between;
align-items:center;
color:#fff;
}

.logo{
display:flex;
align-items:center;
gap:8px;
font-size:20px;
font-weight:700;
}

.logo img{height:32px}

.wallet-pill{
background:rgba(255,255,255,.25);
padding:8px 14px;
border-radius:20px;
font-weight:700;
}

/* ===== PAGE ===== */
.container{padding:16px}

.title-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.title{font-size:22px;font-weight:700}

.filter{font-size:14px;color:#777;cursor:pointer}

.card{
background:#fff;
border-radius:16px;
overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.item{
padding:14px 16px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #eee;
}

.left{display:flex;flex-direction:column;gap:4px}

.amount.plus{color:#18a558;font-weight:700}
.amount.minus{color:#e53935;font-weight:700}

.desc{font-size:15px}
.date{font-size:12px;color:#888}

.arrow{color:#bbb;font-size:18px}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-around;
padding:8px 0 6px;
border-top:1px solid #ddd;
}

.nav-item{text-align:center;font-size:12px;color:#888}
.nav-item img{width:22px;display:block;margin:0 auto 2px}

.nav-item.active{
color:#ff3b3b;
font-weight:600;
}

.nav-item.active img{
filter:brightness(0) saturate(100%) invert(34%) sepia(92%) saturate(7400%) hue-rotate(349deg) brightness(103%) contrast(101%);
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="topbar">
  <div class="logo">
    <img src="Image/logo.png">
    <span>ADSVERO</span>
  </div>

  <div class="wallet-pill">
    ₹ <span id="walletAmt">0.00</span>
  </div>
</div>

<!-- CONTENT -->
<div class="container">

  <div class="title-row">
    <div class="title">Transaction History</div>
    <div class="filter" onclick="toggleFilter()">All types ▾</div>
  </div>

  <div class="card" id="historyList"></div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item">
    <a href="index.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Home.png">
      Home
    </a>
  </div>

  <div class="nav-item">
    <a href="tasks.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Task.png">
      Tasks
    </a>
  </div>

  <div class="nav-item active">
    <a href="history.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Wallet.png">
      Wallet
    </a>
  </div>

  <div class="nav-item">
    <a href="account.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Name.png">
      Account
    </a>
  </div>
</div>

<script>
/* ===== WALLET LOAD ===== */
function loadWallet(){
  let bal = localStorage.getItem("walletBalance") || 0;
  document.getElementById("walletAmt").innerText = parseFloat(bal).toFixed(2);
}

/* ===== HISTORY LOAD ===== */
function loadHistory(){
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  let history = JSON.parse(localStorage.getItem("txHistory") || "[]");

  history.reverse().forEach(tx=>{
    const item = document.createElement("div");
    item.className = "item " + tx.type;

    item.innerHTML = `
      <div class="left">
        <div class="amount ${tx.type==='deposit'?'plus':'minus'}">
          ${tx.type==='deposit'?'+':'-'} ₹${tx.amount}
        </div>
        <div class="desc">${tx.note}</div>
        <div class="date">${tx.date}</div>
      </div>
      <div class="arrow">›</div>
    `;

    list.appendChild(item);
  });
}

/* ===== FILTER ===== */
let filterMode="all";

function toggleFilter(){
  if(filterMode==="all"){filterMode="deposit"}
  else if(filterMode==="deposit"){filterMode="withdraw"}
  else{filterMode="all"}

  document.querySelector(".filter").innerText=
    filterMode==="all"?"All types ▾":
    filterMode==="deposit"?"Deposit ▾":"Withdraw ▾";

  applyFilter();
}

function applyFilter(){
  const items=document.querySelectorAll(".item");

  items.forEach(i=>{
    if(filterMode==="all") i.style.display="flex";
    else if(filterMode==="deposit")
      i.style.display=i.classList.contains("deposit")?"flex":"none";
    else
      i.style.display=i.classList.contains("withdraw")?"flex":"none";
  });
}

/* ===== INIT ===== */
loadWallet();
loadHistory();
</script>

</body>
</html>
