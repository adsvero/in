<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account | ADSVERO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f2f2f2;
}

/* Mobile container */
#page{
  max-width:430px;
  margin:0 auto;
  background:white;
  min-height:100vh;
  padding-bottom:80px;
}

  /* HEADER */
.header{
background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
padding:18px 0;
color:#fff;
border-bottom-left-radius:32px;
border-bottom-right-radius:32px;
}

.header-top{
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
}

.brand{
display:flex;
align-items:center;
gap:8px;
font-weight:700;
font-size:20px;
}

.brand img{
height:36px;
}

.wallet-badge{
background:rgba(255,255,255,.25);
padding:8px 12px;
border-radius:20px;
font-weight:700;
}

/* ===== PROFILE CARD ===== */
.profile{
  display:flex;
  align-items:center;
  padding:16px;
  border-bottom:1px solid #eee;
}

.profile-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ff3b3b;
  color:white;
  font-size:22px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-right:12px;
}

.profile-info h3{
  font-size:18px;
}

.profile-info p{
  color:#777;
  font-size:13px;
}

/* ===== MENU LIST ===== */
.menu-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-bottom:1px solid #eee;
  text-decoration:none;
  color:#333;
  font-weight:600;
}

.menu-item img{
  width:22px;
}

.menu-item b{
  margin-left:auto;
  color:#999;
}
  
/* Logout Button */
.logout{
  margin:20px 16px;
}

.logout button{
  width:100%;
  padding:12px;
  background:#ff3b3b;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-item.active{ color:#ff3b3b; }
}
</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="brand">
      <img src="Image/logo.png">
      <span></span>
    </div>
    <div class="wallet-badge">₹ 0.00</div>
  </div>
</div>
  
<!-- PROFILE -->
<div class="profile">
<div class="profile-avatar" id="menuAvatar">A</div>
<div class="profile-info">
<h3 id="accName"></h3>
<p id="accPhone"></p>
</div>
</div>

<!-- MENU -->
<a href="profile-pic.html" class="menu-item">
  <img src="Image/profile.png">
  <span>Profile Picture</span>
  <b>›</b>
</a>

<a href="referral.html" class="menu-item">
  <img src="Image/referral.png">
  <span>Referral Program</span>
  <b>›</b>
</a>

<a href="account-details.html" class="menu-item">
  <img src="Image/Kyc.png">
  <span>Account Details</span>
  <b>›</b>
</a>

<a href="history.html" class="menu-item">
  <img src="Image/history.png">
  <span>Transaction History</span>
  <b>›</b>
</a>

<a href="https://wa.me/916205702371?text=Hello sir please hepl me Support" class="menu-item">
<img src="Image/support.png">
<span>Support / Help Center</span>
<b></b>
</a>

<!-- LOGOUT -->
<div class="logout">
  <button onclick="logout()">Logout</button>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item">
    <a href="index.html" style="text-decoration:none; color:inherit;">
      <img src="Image/Home.png">Home
    </a>
  </div>

  <div class="nav-item">
    <a href="tasks.html" style="text-decoration:none; color:inherit;">
      <img src="Image/Task.png">Tasks
    </a>
  </div>

  <div class="nav-item">
    <a href="wallet.html" style="text-decoration:none; color:inherit;">
      <img src="Image/Wallet.png">Wallet
    </a>
  </div>

  <div class="nav-item active">
    <a href="account.html" style="text-decoration:none; color:inherit;">
      <img src="Image/Name.png">Account
    </a>
  </div>
</div>

<script>
function loadMenuProfile(){

const name = localStorage.getItem("userName") || "Himanshu";
const email = localStorage.getItem("userEmail") || "himanshu@gmail.com";
const dp = localStorage.getItem("profilePic");

document.getElementById("menuName").innerText = name;
document.getElementById("menuEmail").innerText = email;

const avatar = document.getElementById("menuAvatar");

if(dp){
avatar.innerHTML = "";
avatar.style.backgroundImage = `url(${dp})`;
avatar.style.backgroundSize = "cover";
avatar.style.backgroundPosition = "center";
}else{
avatar.innerText = name.charAt(0).toUpperCase();
}

}

loadMenuProfile();
</script>
<script>

const user = JSON.parse(localStorage.getItem("adsveroUser"));

if(user){

  document.getElementById("accName").innerText = user.name;
  document.getElementById("accEmail").innerText = user.email;

}

</script>
</body>
</html>
