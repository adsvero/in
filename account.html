<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account | ADSVERO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f2f2f2;
}

/* Mobile container */
#page{
  max-width:430px;
  margin:0 auto;
  background:white;
  min-height:100vh;
  padding-bottom:80px;
}

/* ===== HEADER ===== */
.header{
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
  padding:16px;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header .brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:18px;
}

.header img{
  height:32px;
}

.wallet-badge{
  background:rgba(255,255,255,.25);
  padding:6px 10px;
  border-radius:20px;
  font-weight:700;
}

/* ===== PROFILE CARD ===== */
.profile{
  display:flex;
  align-items:center;
  padding:16px;
  border-bottom:1px solid #eee;
}

.profile-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ff3b3b;
  color:white;
  font-size:22px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-right:12px;
}

.profile-info h3{
  font-size:18px;
}

.profile-info p{
  color:#777;
  font-size:13px;
}

/* ===== MENU LIST ===== */
.menu-list{
  padding:10px 16px;
}

.menu-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.menu-item img{
  width:22px;
  margin-right:10px;
}

.menu-left{
  display:flex;
  align-items:center;
}

/* Logout Button */
.logout{
  margin:20px 16px;
}

.logout button{
  width:100%;
  padding:12px;
  background:#ff3b3b;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-item.active{ color:#ff3b3b; }
}
</style>
</head>

<!-- HEADER -->

     ₹00.0
  </div>
</div>

<!-- PROFILE -->
<div class="profile">

    <h3>Himanshu</h3>
    <p>himanshu@gmail.com</p>
  </div>
</div>

<!-- MENU -->
<div class="menu-list">

  <div class="menu-item">
    <div class="menu-left">
      <img src="Image/profile.png"> My Profile
    </div>
    <span>›</span>
  </div>

  <div class="menu-item">

  </div>

  <div class="menu-item">

    </div>
    <span>›</span>
  </div>

  <div class="menu-item">
    <div class="menu-left">
      <img src="Image/history.png"> Transaction History
    </div>
    <span>›</span>
  </div>

  <div class="menu-item">
    <div class="menu-left">
      <img src="Image/support.png"> Support / Help Center
    </div>
    <span>›</span>
  </div>

</div>

<!-- LOGOUT -->
<div class="logout">
  <button onclick="logout()">Logout</button>
</div>

</div>
