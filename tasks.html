<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks | ADSVERO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f2f2f2;
}

/* ===== MOBILE CONTAINER ===== */
#page{
  max-width:430px;
  width:100%;
  margin:0 auto;
  background:white;
  min-height:100vh;
  padding-bottom:80px;
}

/* ===== HEADER ===== */
.task-header{
  background:linear-gradient(90deg,#ff3b3b,#ff7a6a);
  color:white;
  padding:18px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

.task-header .left{
  display:flex;
  align-items:center;
  gap:8px;
}

.task-header img{
  height:28px;
}

/* balance badge */
.wallet-badge{
  background:rgba(255,255,255,.25);
  padding:8px 12px;
  border-radius:20px;
  font-weight:bold;
}

/* ===== SECTION ===== */
.section{
  padding:16px;
}

/* ===== TITLE ===== */
.section h2{
  margin-bottom:4px;
}

.subtitle{
  color:#777;
  margin-bottom:12px;
}

/* ===== TASK CARD ===== */
.task-card{
  background:white;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
  border:1px solid rgba(0,0,0,.05);
}

/* TOP ROW (TITLE + BUTTON) */
.task-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}

.task-title{
  font-weight:bold;
}

/* progress bar */
.progress-bg{
  width:100%;
  height:6px;
  background:#ddd;
  border-radius:4px;
  margin-top:8px;
}

.progress-fill{
  height:6px;
  background:#ff3b3b;
  border-radius:4px;
}

/* buttons */
.start-btn{
  background:#f2a60c;
  color:black;
  border:none;
  padding:10px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.done-btn{
  background:#2e9f5a;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:10px;
  font-weight:bold;
}

/* notice box */
.notice{
  background:#e7f2ff;
  border-radius:16px;
  padding:12px;
  margin-top:10px;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
  font-weight:700;
}

.nav-item img{
  width:26px;
  display:block;
  margin:0 auto 4px;
}

.nav-item.active{ color:#ff3b3b; }

</style>
</head>

<body>

<div id="page">

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="brand">
      <img src="Image/logo.png">
      <span></span>
    </div>
    <div class="wallet-badge">₹ 0.00</div>
  </div>
</div>

<div class="section">

<h2>Today’s Tasks</h2>
<p class="subtitle">Complete the ads to earn rewards</p>

<!-- TASKS LOOP (10 TASKS) -->
<script>
for(let i=1;i<=10;i++){
document.write(`
<div class="task-card">
  <div class="task-top">
    <span class="task-title">Ad Task ${i} • Watch & Earn</span>
    <button class="start-btn" onclick="startTask(${i})">START</button>
  </div>

  <p>Watch Video (30 sec)</p>

  <div class="progress-bg">
    <div class="progress-fill" style="width:${i*8}%"></div>
  </div>
</div>
`);
}
</script>

<!-- NOTICE -->
<div class="notice">
  <b>Don’t skip the ad!</b><br>
  Minimum watch time: 30 seconds
</div>

</div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item">
    <a href="index.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Home.png">Home
    </a>
  </div>

  <div class="nav-item active">
    <a href="tasks.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Task.png">Tasks
    </a>
  </div>

  <div class="nav-item">
    <a href="wallet.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Wallet.png">Wallet
    </a>
  </div>

  <div class="nav-item">
    <a href="account.html" style="text-decoration:none;color:inherit;">
      <img src="Image/Name.png">Account
    </a>
  </div>
</div>

<script>
function startTask(id){
  alert("Task "+id+" started. Watch 30 seconds!");
}
</script>

</body>
</html>
